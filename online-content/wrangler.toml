name = "pmm-content-updates"
main = "worker.js"
compatibility_date = "2026-11-15"
workers_dev = true

# This is the owner's existing FREE Workers KV namespace.
# Enter the actual namespace ID from Cloudflare only for CLI deployment.
# Dashboard deployments use the same binding name: PMM_CONTENT.
[[kv_namespaces]]
binding = "PMM_CONTENT"
id = "REPLACE_WITH_CLOUDFLARE_KV_ID"
