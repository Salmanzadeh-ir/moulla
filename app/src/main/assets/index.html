.headline,.subhead,.feedback{display:none!important}

}

#guest-pane .guest-return{top:43.6%!important;right:11%!important;left:auto!important;width:13%!important;height:4.9%!important;border:2px solid #bd862c!important;background:linear-gradient(#fff6c9,#dba54d)!important;border-radius:50%!important;box-shadow:0 2px 7px #61421788!important;z-index:10!important}
#guest-pane .guest-return::after{content:'↩';font-size:clamp(17px,5.1cqw,28px);font-weight:900;color:#07466d;display:flex;justify-content:center;align-items:center;height:100%}
#guest-pane .guest-carousel{
  --guest-wheel-radius:67cqw;
  left:4%!important;top:51%!important;width:92%!important;height:35.5%!important;
  position:absolute!important;overflow:visible!important;display:block!important;
  padding:0!important;z-index:6!important;
  perspective:780px!important;perspective-origin:center center!important;
  touch-action:none!important;cursor:grab;user-select:none;
  scrollbar-width:none!important;
}
#guest-pane .guest-carousel:active{cursor:grabbing}
#guest-pane .guest-wheel-rotor{width:100%;height:100%;position:relative;transform-style:preserve-3d!important;transition:transform .76s cubic-bezier(.19,.7,.16,1);will-change:transform}
#guest-pane .guest-album-board{
  position:absolute!important;top:50%!important;left:50%!important;
  display:block!important;width:39cqw!important;height:auto!important;aspect-ratio:9/16!important;
  flex:none!important;box-sizing:border-box!important;
  padding:1.25cqw!important;
  border:3px solid #07538c!important;border-radius:16px 16px 12px 12px!important;
  background:linear-gradient(160deg,#fff4be,#d69c45)!important;
  box-shadow:0 0 0 3px #edb85b,0 0 13px #fff4c9bd,0 8px 17px #63330e9e!important;
  transform:translate(-50%,-50%) rotateY(var(--board-angle)) translateZ(var(--guest-wheel-radius))!important;
  backface-visibility:hidden!important;-webkit-backface-visibility:hidden!important;
  scroll-snap-align:none!important;cursor:pointer;overflow:hidden!important;
}
#guest-pane .guest-album-board img{width:100%!important;height:100%!important;object-fit:contain!important;object-position:center!important;border-radius:10px!important;image-rendering:auto!important;pointer-events:none}
#guest-pane .guest-position{top:89.0%!important;left:36%!important;width:28%!important;z-index:8!important;pointer-events:none!important;background:#fbe0a2eb;border:1px solid #be822a;border-radius:30px;text-align:center;line-height:1.7}
#guest-pane .guest-position::before,#guest-pane .guest-position::after{content:'✦';font-size:.72em}
#guest-pane .guest-nav,#guest-pane .guest-dots,#guest-pane .guest-art{display:none!important}
#guest-pane .guest-fullview{z-index:30!important}
@media(prefers-reduced-motion:reduce){#guest-pane .guest-wheel-rotor{transition:none!important}}


/* Circular depth refinement: one large, readable central image + adjacent curved panels. */

  height:100dvh !important;
  max-width:none !important;
  max-height:none !important;
  aspect-ratio:auto !important;
  margin:0 !important;
  padding:0 !important;
  border:0 !important;
  border-radius:0 !important;
  box-shadow:none !important;
}
.stage > img.backdrop, .stage > .pane {

  left:0 !important;

  bottom:0 !important;
  width:100% !important;
  height:100% !important;
  max-width:none !important;
  max-height:none !important;
  aspect-ratio:auto !important;
  transform:none !important;
}
.stage > img.backdrop { object-fit:fill !important; }

const ABOUT_HTML = "<h1>درباره من</h1>\n<p><strong>محمد کاظمی‌نیا</strong>، طلبه درس خارج و مدرس حوزه علمیه قم، دانش‌آموخته بنیاد بین‌المللی نهج‌البلاغه و پژوهشگر حوزه معارف علوی هستم.</p>\n<p>بخش مهمی از فعالیت علمی و تبلیغی من به مطالعه، شرح و ترویج معارف نهج‌البلاغه اختصاص دارد؛ با این باور که کلمات امیرالمؤمنین علی(ع) تنها برای خواندن و دانستن نیستند، بلکه می‌توانند راهنمای اندیشه، انتخاب و رفتار ما در زندگی باشند.</p>\n<h2>از شرح نهج‌البلاغه تا کاربردی کردن معارف</h2>\n<p>فعالیت آموزشی خود را در فضای مجازی از سال ۱۳۹۸ با برگزاری جلسات شرح نهج‌البلاغه آغاز کردم. این مسیر در قالب دو دوره کامل شرح نهج‌البلاغه ادامه یافت و در هر دو دوره، تمام کتاب، از خطبه‌ها و نامه‌ها تا حکمت‌ها، به‌صورت ترتیبی شرح داده شد.</p>\n<p>دوره دوم شرح نهج‌البلاغه، از ابتدای سال ۱۴۰۱ آغاز شد و در ۱۳ رجب ۱۴۰۴ به پایان رسید. این دوره در قالب حدود <strong>۱۱۰۰ جلسه آموزشی</strong> برگزار شد و تمام نهج‌البلاغه، از ابتدا تا انتها، به‌صورت پیوسته و تفصیلی مورد شرح و بررسی قرار گرفت.</p>\n<p>اما پس از پیمودن این مسیر، دغدغه جدی‌تری شکل گرفت: چگونه می‌توان معارف نهج‌البلاغه را از فضای مطالعه و شرح، به متن زندگی مردم آورد؟</p>\n<p>یکی از انگیزه‌های مهم این حرکت، تأکیدهای رهبر معظم انقلاب بر ضرورت کاربردی کردن معارف دینی بود؛ از جمله این بیان که:</p>\n<p>«عناوین و مفاهیم معرفتی اسلام، جنبه‌ی عملیّاتی و ترجمه‌ی عملیّاتی پیدا کند و عمل به آنها ممکن و رایج بشود.»</p>\n<p>از نگاه ایشان، معارف اهل‌بیت(ع) همچون گنجینه‌ای ارزشمند نباید در محدوده کتاب‌ها و مباحث علمی باقی بماند؛ بلکه باید با زبان روز و شیوه‌های درست، به زندگی انسان‌ها راه پیدا کند. ایشان همچنین درباره نهج‌البلاغه تأکید کرده‌اند که دردها، خطرها و مسائل زندگی انسان را می‌توان در آینه این کتاب شناخت و درمان بسیاری از آن‌ها را نیز در همین گنجینه جست‌وجو کرد.</p>\n<p>با توجه به دشواری این مسیر ــ که به‌مراتب پیچیده‌تر از شرح ترتیبی یک کتاب است ــ تلاش کردم در ادامه فعالیت‌ها، از بیان و توضیح معارف به سمت کشف کاربردهای آن‌ها حرکت کنم؛ یعنی ببینیم کلمات امیرالمؤمنین(ع) در زندگی امروز ما چه می‌گویند و چگونه می‌توانند رفتار و انتخاب‌های ما را تغییر دهند.</p>\n<p>در همین راستا، دوره‌های زیر برگزار شده است:</p>\n<ul>\n<li><strong>۵۰ جلسه توحید کاربردی:</strong> با هدف تبدیل مباحث اعتقادی به بینش و رفتار عملی و نشان دادن نقش توحید در تصمیم‌ها و انتخاب‌های روزمره.</li>\n<li><strong>۴۰ جلسه دیدن خدا در زندگی:</strong> با محوریت تقویت نگاه توحیدی به اتفاقات، نعمت‌ها، شادی‌ها و فراز و نشیب‌های زندگی.</li>\n<li><strong>۵۰ جلسه شرح بخشی از کتاب کافی:</strong> در مسیر تبیین و ترویج معارف روایی اهل‌بیت(ع).</li>\n</ul>\n<h2>آثار علمی و ادبی</h2>\n<p>در کنار فعالیت‌های آموزشی و پژوهشی، در حوزه شعر آیینی و نوحه نیز فعالیت دارم. مجموعه شعر و نوحه <strong>«نفس‌های گرم»</strong> از آثار منتشرشده من در این حوزه است. برخی از سروده‌ها و نوحه‌هایم در مراسم و محافل مذهبی اجرا شده‌اند؛ از جمله نوحه‌هایی که توسط مداحان در محضر رهبر انقلاب اجرا شده است.</p>\n<p>رمان تاریخی <strong>«به اتفاق فرمانده»</strong> نیز در سال ۱۴۰۰ توسط انتشارات شهید کاظمی منتشر شده است. این اثر روایتی داستانی از یک موضوع تاریخی است که با قالبی متفاوت و بدیع ارائه شده است.</p>\n<p>همچنین کتاب <strong>«درمان با نهج‌البلاغه»</strong> را با رویکردی کاربردی و در قالبی مصور و در ابعاد یک گوشی تلفن همراه تألیف کرده‌ام. این کتاب به سراغ <strong>۶۰ درد و مسئله واقعی جامعه</strong> می‌رود و می‌کوشد با بهره‌گیری از کلمات امیرالمؤمنین(ع)، راهی برای شناخت و درمان آن‌ها پیش روی مخاطب بگذارد.</p>\n<h2>نرم‌افزار پای منبر مولا</h2>\n<p><strong>«پای منبر مولا»</strong> بستری برای دسترسی آسان و منظم به مجموعه جلسات و محتواهای آموزشی و معارفی است که در سال‌های گذشته تهیه و ارائه شده‌اند.</p>\n<p>هدف از راه‌اندازی این نرم‌افزار، فراهم کردن امکان بهره‌مندی آسان‌تر علاقه‌مندان از این محتواها و در نهایت، ترویج کلمات و معارف امیرالمؤمنین علی(ع) است؛ تا نهج‌البلاغه و سخنان آن حضرت، بیش از پیش در دسترس قرار بگیرد و از فضای مطالعه و شنیدن، به متن زندگی فردی و اجتماعی ما راه پیدا کند.</p>\n<p><strong>دغدغه اصلی این مسیر، تنها دانستن معارف نیست؛ بلکه فهمیدن، به‌کاربستن و زندگی کردن با آن‌هاست.</strong></p>\n<p>امیدوارم این تلاش اندک، قدمی در مسیر شناخت بهتر کلام امیرالمؤمنین(ع)، فهم عمیق‌تر معارف اهل‌بیت(ع) و عمل به آن‌ها باشد.</p>\n<p>والحمدلله رب العالمین</p>\n";

function drawRows(){

 el.querySelectorAll('.session').forEach(b=>b.addEventListener('click',()=>{
  const x=DATA[section].find(v=>v.number===Number(b.dataset.n));
  if(!x?.url){toast('لینک این جلسه هنوز ثبت نشده است.');return;}

  setState('player',section,x);
}));
}
function openEitaaArchive(url){openEitaa(url)}
function openEitaa(url){
  const target=String(url||'');
  if(!/^https:\/\/eitaa\.com\/(?:joinchat\/[a-zA-Z0-9]+|[a-zA-Z0-9_]+\/\d+)(?:[/?#].*)?$/.test(target))return;
  // The trusted native bridge starts Eitaa without navigating this WebView.
  // Therefore there is no white web page and returning preserves the same list.
  if(window.PMMNative&&typeof window.PMMNative.openEitaa==='function'){
    window.PMMNative.openEitaa(target);
  }else window.open(target,'_blank','noopener');
}

   }
 });
 guestCarousel.addEventListener('pointerup',e=>{
   if(!guestPointer)return;
   const dx=e.clientX-guestPointer.x,dy=e.clientY-guestPointer.y;guestPointer=null;
   try{if(guestCarousel.hasPointerCapture(e.pointerId))guestCarousel.releasePointerCapture(e.pointerId)}catch(_){}
   if(Math.abs(dx)>26&&Math.abs(dx)>Math.abs(dy)*1.1){
     guestSwipe=true;
     const steps=Math.min(3,Math.max(1,Math.round(Math.abs(dx)/76)));
     spinGuest((dx<0?1:-1)*steps);
     setTimeout(()=>guestSwipe=false,400);
   }
 });
 guestCarousel.addEventListener('pointercancel',()=>{guestPointer=null});
 guestInitDone=true;
}
function closestGuestDelta(to){
 const n=GUEST_ALBUM.length;
 return ((to-guestIndex+n+n/2)%n)-n/2;
}
function updateGuestWheel(){
 if(!guestRing)return;
 const n=GUEST_ALBUM.length;
 guestBoards.forEach((board,i)=>{
   // Five visible posters follow a curved 3D arc. The other 13 remain on the
   // invisible back of the conceptual 18-position circle (not a sliding list).
   const relative=((i-guestIndex+n+n/2)%n)-n/2;
   const distance=Math.abs(relative);
   const angle=relative*38;
   const rad=angle*Math.PI/180;
   board.style.setProperty('--wheel-x',(Math.sin(rad)*45).toFixed(3)+'cqw');
   board.style.setProperty('--wheel-z',(Math.cos(rad)*33-17).toFixed(3)+'cqw');
   board.style.setProperty('--wheel-angle',(-angle)+'deg');
   board.style.setProperty('--wheel-scale',distance===0?'1':distance===1?'0.85':'0.70');
   board.style.opacity=distance>2?'0':distance===2?'0.58':distance===1?'0.88':'1';
   board.style.zIndex=String(10-distance);
   board.style.pointerEvents=distance>2?'none':'auto';
   board.setAttribute('aria-current',String(i===guestIndex));
   board.tabIndex=distance<3?0:-1;
 });
 document.getElementById('guest-position').textContent=fa(guestIndex+1)+' / '+fa(GUEST_ALBUM.length);
}
function spinGuest(delta){
 guestStep+=delta;
 guestIndex=((guestStep%GUEST_ALBUM.length)+GUEST_ALBUM.length)%GUEST_ALBUM.length;
 saveGuest(guestIndex);updateGuestWheel();resetGuestTicker();
}
function resetGuestTicker(){
 if(guestTicker){clearInterval(guestTicker);guestTicker=null}
 if(screen==='guest'&&document.getElementById('guest-fullview').hidden){
   guestTicker=setInterval(()=>{
      if(screen==='guest'&&document.getElementById('guest-fullview').hidden)spinGuest(1);
   },GUEST_DELAY_MS);
 }
}
function enterGuest(){
 buildGuestBoards();
 const prev=guestStored();const n=GUEST_ALBUM.length;
 const selected=prev===null?Math.floor(Math.random()*n):(prev+1+Math.floor(Math.random()*(n-1)))%n;
 guestStep=selected;guestIndex=selected;
 saveGuest(guestIndex);
 document.getElementById('guest-fullview').hidden=true;
 setState('guest');updateGuestWheel();
 resetGuestTicker();
}
function showGuestFull(){
 const view=document.getElementById('guest-fullview');view.hidden=false;
 document.getElementById('guest-full-image').src=GUEST_ALBUM[guestIndex];
 document.getElementById('guest-full-count').textContent=fa(guestIndex+1)+' از '+fa(GUEST_ALBUM.length);
 if(guestTicker){clearInterval(guestTicker);guestTicker=null}
}
function closeGuestFull(){document.getElementById('guest-fullview').hidden=true;resetGuestTicker()}
document.getElementById('hit-guest').addEventListener('click',enterGuest);
document.getElementById('guest-return').addEventListener('click',()=>{if(guestTicker){clearInterval(guestTicker);guestTicker=null}setState('home')});
document.getElementById('guest-full-close').addEventListener('click',closeGuestFull);
document.getElementById('home-about').addEventListener('click',()=>setState('about'));
document.querySelectorAll('[data-section]').forEach(b=>b.addEventListener('click',()=>setState('list',b.dataset.section)));
document.getElementById('back-button').addEventListener('click',goBack);
document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace'&&document.activeElement?.tagName!=='INPUT'&&document.activeElement?.tagName!=='TEXTAREA'){e.preventDefault();goBack();}});
render();
</script>
</body></html>
