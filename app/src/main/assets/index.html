  position:absolute;width:max(100%,56.28dvh);height:max(100%,177.68vw);

}

/* V9.1: travelling luminous glint on the *existing* five iwan frames.

  pointer-events:none;fill:none;stroke-linecap:round;stroke-linejoin:round}

  filter:drop-shadow(0 0 1.5px #67dbed)}

  stroke-dasharray:11 89;stroke-dashoffset:0;
  filter:drop-shadow(0 0 2px #fff9e0) drop-shadow(0 0 4px #f2b94a);
  animation:iwan-dash-travel 6.2s linear infinite}

/* V9.5: guest sayings match the golden inset panels in the About page. */
.guest-mola-panel{background:linear-gradient(#fff6cb,#f0c776 55%,#d69c44);border:3px solid #b16d1e;box-shadow:inset 0 2px #fff6d0,inset 0 -3px #ad6a20,0 4px 5px #57330e9c,0 0 0 1px #e8b65c;border-radius:15px;width:100%;padding:10px 8px 12px;margin-top:clamp(8px,3.2cqw,16px)}
.guest-mola-header{display:flex;align-items:center;justify-content:center;gap:8px;color:#07365f;font:900 clamp(14px,4.1cqw,23px)/1.6 var(--pmm-text-font);text-align:center;margin:2px 4px 10px;text-shadow:0 1px 0 #fff2bf}
.guest-mola-star{color:#0d5a92}
.guest-mola-window{width:100%;overflow:hidden;border-radius:14px;border:2px solid #c08d37;background:linear-gradient(145deg,#ffeabd,#d6a557);box-shadow:inset 0 2px 8px #7751185c,0 3px 9px #673d1559;padding:10px 0}
.guest-mola-track{display:flex;direction:ltr;width:max-content;will-change:transform;animation:guest-mola-slide 42s linear infinite}
.guest-mola-group{display:flex;gap:10px;padding-right:10px;flex-shrink:0}
.guest-mola-panel:hover .guest-mola-track,.guest-mola-panel:focus-within .guest-mola-track{animation-play-state:paused}
.guest-mola-card{width:clamp(178px,49cqw,248px);min-height:clamp(205px,57cqw,282px);flex:none;border:2px solid #bf8730;border-radius:16px;background:linear-gradient(#fff8d9,#fff0bd 38%,#edc06e);overflow:hidden;box-shadow:inset 0 1px #fffdf0,0 4px 10px #72401066;padding:0;display:grid;grid-template-rows:clamp(102px,28cqw,132px) 1fr;cursor:pointer}
.guest-mola-card img{width:100%;height:100%;object-fit:cover;background:#b4843f}
.guest-mola-caption{display:flex;align-items:center;justify-content:center;padding:10px 12px;color:#123a60;font:700 clamp(12px,3.25cqw,17px)/1.95 var(--pmm-text-font);text-align:center;direction:rtl}
.guest-mola-card:focus-visible{outline:3px solid #0a66a2}
.guest-mola-note{padding:9px 6px 2px;color:#6b481f;font:700 clamp(11px,2.9cqw,15px)/1.9 var(--pmm-text-font);text-align:center}
@keyframes guest-mola-slide{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.guest-mola-track{animation:none}.guest-mola-window{overflow-x:auto}}

</style>

const ABOUT_HTML = "<h1>درباره من</h1>\n<p><strong>محمد کاظمی‌نیا</strong>، طلبه درس خارج و مدرس حوزه علمیه قم، دانش‌آموخته بنیاد بین‌المللی نهج‌البلاغه و پژوهشگر حوزه معارف علوی هستم.</p>\n<p>بخش مهمی از فعالیت علمی و تبلیغی من به مطالعه، شرح و ترویج معارف نهج‌البلاغه اختصاص دارد؛ با این باور که کلمات امیرالمؤمنین علی(ع) تنها برای خواندن و دانستن نیستند، بلکه می‌توانند راهنمای اندیشه، انتخاب و رفتار ما در زندگی باشند.</p>\n<h2>از شرح نهج‌البلاغه تا کاربردی کردن معارف</h2>\n<p>فعالیت آموزشی خود را در فضای مجازی از سال ۱۳۹۸ با برگزاری جلسات شرح نهج‌البلاغه آغاز کردم. این مسیر در قالب دو دوره کامل شرح نهج‌البلاغه ادامه یافت و در هر دو دوره، تمام کتاب، از خطبه‌ها و نامه‌ها تا حکمت‌ها، به‌صورت ترتیبی شرح داده شد.</p>\n<p>دوره دوم شرح نهج‌البلاغه، از ابتدای سال ۱۴۰۱ آغاز شد و در ۱۳ رجب ۱۴۰۴ به پایان رسید. این دوره در قالب حدود <strong>۱۱۰۰ جلسه آموزشی</strong> برگزار شد و تمام نهج‌البلاغه، از ابتدا تا انتها، به‌صورت پیوسته و تفصیلی مورد شرح و بررسی قرار گرفت.</p>\n<p>اما پس از پیمودن این مسیر، دغدغه جدی‌تری شکل گرفت: چگونه می‌توان معارف نهج‌البلاغه را از فضای مطالعه و شرح، به متن زندگی مردم آورد؟</p>\n<p>یکی از انگیزه‌های مهم این حرکت، تأکیدهای رهبر معظم انقلاب بر ضرورت کاربردی کردن معارف دینی بود؛ از جمله این بیان که:</p>\n<p>«عناوین و مفاهیم معرفتی اسلام، جنبه‌ی عملیّاتی و ترجمه‌ی عملیّاتی پیدا کند و عمل به آنها ممکن و رایج بشود.»</p>\n<p>از نگاه ایشان، معارف اهل‌بیت(ع) همچون گنجینه‌ای ارزشمند نباید در محدوده کتاب‌ها و مباحث علمی باقی بماند؛ بلکه باید با زبان روز و شیوه‌های درست، به زندگی انسان‌ها راه پیدا کند. ایشان همچنین درباره نهج‌البلاغه تأکید کرده‌اند که دردها، خطرها و مسائل زندگی انسان را می‌توان در آینه این کتاب شناخت و درمان بسیاری از آن‌ها را نیز در همین گنجینه جست‌وجو کرد.</p>\n<p>با توجه به دشواری این مسیر ــ که به‌مراتب پیچیده‌تر از شرح ترتیبی یک کتاب است ــ تلاش کردم در ادامه فعالیت‌ها، از بیان و توضیح معارف به سمت کشف کاربردهای آن‌ها حرکت کنم؛ یعنی ببینیم کلمات امیرالمؤمنین(ع) در زندگی امروز ما چه می‌گویند و چگونه می‌توانند رفتار و انتخاب‌های ما را تغییر دهند.</p>\n<p>در همین راستا، دوره‌های زیر برگزار شده است:</p>\n<ul>\n<li><strong>۵۰ جلسه توحید کاربردی:</strong> با هدف تبدیل مباحث اعتقادی به بینش و رفتار عملی و نشان دادن نقش توحید در تصمیم‌ها و انتخاب‌های روزمره.</li>\n<li><strong>۴۰ جلسه دیدن خدا در زندگی:</strong> با محوریت تقویت نگاه توحیدی به اتفاقات، نعمت‌ها، شادی‌ها و فراز و نشیب‌های زندگی.</li>\n<li><strong>۵۰ جلسه شرح بخشی از کتاب کافی:</strong> در مسیر تبیین و ترویج معارف روایی اهل‌بیت(ع).</li>\n</ul>\n<h2>آثار علمی و ادبی</h2>\n<p>در کنار فعالیت‌های آموزشی و پژوهشی، در حوزه شعر آیینی و نوحه نیز فعالیت دارم. مجموعه شعر و نوحه <strong>«نفس‌های گرم»</strong> از آثار منتشرشده من در این حوزه است. برخی از سروده‌ها و نوحه‌هایم در مراسم و محافل مذهبی اجرا شده‌اند؛ از جمله نوحه‌هایی که توسط مداحان در محضر رهبر انقلاب اجرا شده است.</p>\n<p>رمان تاریخی <strong>«به اتفاق فرمانده»</strong> نیز در سال ۱۴۰۰ توسط انتشارات شهید کاظمی منتشر شده است. این اثر روایتی داستانی از یک موضوع تاریخی است که با قالبی متفاوت و بدیع ارائه شده است.</p>\n<p>همچنین کتاب <strong>«درمان با نهج‌البلاغه»</strong> را با رویکردی کاربردی و در قالبی مصور و در ابعاد یک گوشی تلفن همراه تألیف کرده‌ام. این کتاب به سراغ <strong>۶۰ درد و مسئله واقعی جامعه</strong> می‌رود و می‌کوشد با بهره‌گیری از کلمات امیرالمؤمنین(ع)، راهی برای شناخت و درمان آن‌ها پیش روی مخاطب بگذارد.</p>\n<h2>نرم‌افزار پای منبر مولا</h2>\n<p><strong>«پای منبر مولا»</strong> بستری برای دسترسی آسان و منظم به مجموعه جلسات و محتواهای آموزشی و معارفی است که در سال‌های گذشته تهیه و ارائه شده‌اند.</p>\n<p>هدف از راه‌اندازی این نرم‌افزار، فراهم کردن امکان بهره‌مندی آسان‌تر علاقه‌مندان از این محتواها و در نهایت، ترویج کلمات و معارف امیرالمؤمنین علی(ع) است؛ تا نهج‌البلاغه و سخنان آن حضرت، بیش از پیش در دسترس قرار بگیرد و از فضای مطالعه و شنیدن، به متن زندگی فردی و اجتماعی ما راه پیدا کند.</p>\n<p><strong>دغدغه اصلی این مسیر، تنها دانستن معارف نیست؛ بلکه فهمیدن، به‌کاربستن و زندگی کردن با آن‌هاست.</strong></p>\n<p>امیدوارم این تلاش اندک، قدمی در مسیر شناخت بهتر کلام امیرالمؤمنین(ع)، فهم عمیق‌تر معارف اهل‌بیت(ع) و عمل به آن‌ها باشد.</p>\n<p>والحمدلله رب العالمین</p>\n";

function renderClips(){
  const clips=VIDEO_CLIPS.length?VIDEO_CLIPS:Array.from({length:5},(_,i)=>({title:'کلیپ '+fa(i+1),url:''}));
  const cards=clips.map((v,i)=>`<button type="button" class="clip-card" data-clip="${i}" aria-label="${safe(v.title)}"><span class="clip-play" aria-hidden="true">▶</span><span>${safe(v.title)}</span></button>`).join('');
  contents.innerHTML=`<div class="clips-head">کلیپ‌های تصویری</div><div class="clips-window"><div class="clips-track"><div style="display:flex;gap:10px;padding:0 5px">${cards}</div><div style="display:flex;gap:10px;padding:0 5px" aria-hidden="true">${cards}</div></div></div><div class="note" style="text-align:center;padding:18px 5px">کلیپ‌های تازه به‌زودی اضافه می‌شوند.</div>`;
  contents.querySelectorAll('[data-clip]').forEach(b=>b.addEventListener('click',()=>{
   const clip=VIDEO_CLIPS[Number(b.dataset.clip)];
   if(!clip?.url){toast('این کلیپ هنوز اضافه نشده است.');return;}
   if(/^https:\/\/eitaa\.com\//i.test(clip.url))openEitaa(clip.url);
   else if(/^https:\/\/(?:www\.)?aparat\.com\/v\//i.test(clip.url))setState('player','clips',{number:Number(b.dataset.clip)+1,url:clip.url});
   else setState('player','clips',{number:Number(b.dataset.clip)+1,url:clip.url});
  }));
}
function renderList(){
 if(section==='nahj'){
 contents.innerHTML=`<div class="content-box"><h2>شرح صوتی نهج‌البلاغه</h2><p>برای شنیدن جلسات از آرشیو استفاده کنید.</p><a class="action"  href="${safe(DATA.nahj.url)}">نمایش آرشیو سایت</a><button class="action" type="button" id="nahj-eitaa">باز کردن آرشیو ایتا</button></div>`;
 document.getElementById('nahj-eitaa')?.addEventListener('click',()=>openEitaaArchive(DATA.nahj.eitaa_url));
 return;
 }
 let input='';if(searching)input='<div class="search-wrap"><input class="search-input" id="search-input" type="search" aria-label="جست‌وجوی جلسات" placeholder="شماره جلسه را بنویسید…"></div>';
 contents.innerHTML=input+'<div class="row-list" id="rows"></div>';
 if(searching){const field=document.getElementById('search-input');field.value=query;field.addEventListener('input',e=>{query=e.target.value;drawRows()});field.focus({preventScroll:true});}
 drawRows();
}
function drawRows(){
 const el=document.getElementById('rows');if(!el)return;
 const q=query.trim().replace(/[۰-۹]/g,c=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(c))).replace(/[٠-٩]/g,c=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(c)));
 const records=DATA[section].filter(x=>!q||String(x.number).includes(q)||String(x.title).includes(q));
 el.innerHTML=records.length?records.map(x=>`<button type="button" class="session ${x.url?'':'missing'}" data-n="${x.number}" aria-label="جلسه ${fa(x.number)}${x.url?'':' — بدون لینک'}"><img loading="lazy" alt="" aria-hidden="true" src="${IMG['row_blank.webp']}"><span class="session-label" lang="fa">جلسه ${fa(x.number)}</span></button>`).join(''):'<div class="empty">جلسه‌ای یافت نشد</div>';
 el.querySelectorAll('.session').forEach(b=>b.addEventListener('click',()=>{
  const x=DATA[section].find(v=>v.number===Number(b.dataset.n));
  if(!x?.url){toast('لینک این جلسه هنوز ثبت نشده است.');return;}
  // One touch to the exact media link; keep the same list in the local WebView.
  if(/^https:\/\/eitaa\.com\//i.test(x.url)){openEitaa(x.url);return;}
  // Restore approved in-app Aparat iframe player; no external app / intermediate page.
  setState('player',section,x);
}));
}
function openEitaaArchive(url){openEitaa(url)}
function openEitaa(url){
  const target=String(url||'');
  if(!/^https:\/\/eitaa\.com\/(?:joinchat\/[a-zA-Z0-9]+|[a-zA-Z0-9_]+\/\d+)(?:[/?#].*)?$/.test(target))return;
  // The trusted native bridge starts Eitaa without navigating this WebView.
  // Therefore there is no white web page and returning preserves the same list.
  if(window.PMMNative&&typeof window.PMMNative.openEitaa==='function'){
    window.PMMNative.openEitaa(target);
  }else window.open(target,'_blank','noopener');
}

function renderAbout(){
  const group=USER_PHOTOS.map((src,i)=>`<button type="button" class="gallery-tile" data-photo="${i}" aria-label="نمایش تصویر ${fa(i+1)}"><img src="${src}" alt="تصویر ${fa(i+1)} از فعالیت‌های آموزشی" loading="lazy"></button>`).join('');
  const guestCards=GUEST_SAYINGS.map((entry,i)=>`<button type="button" class="guest-mola-card" data-guest="${i}" aria-label="جمله مهمان مولا ${fa(i+1)}"><img src="${entry.image}" alt="تصویر ${fa(i+1)} برای جمله مهمان مولا" loading="lazy"><span class="guest-mola-caption">${safe(entry.text)}</span></button>`).join('');
  contents.innerHTML=`<div class="about-menu">
      <button class="about-entry" type="button" id="about-biography"><span class="about-entry-icon">❖</span><span>درباره ما</span></button>
      <button class="about-entry" type="button" id="about-contact"><span class="about-entry-icon">✉</span><span>ارتباط با ما</span></button>
      <div class="gallery-viewport" aria-label="گالری تصاویر فعالیت‌های آموزشی">
        <div class="gallery-track"><div class="gallery-group">${group}</div><div class="gallery-group" aria-hidden="true">${group}</div></div>
      </div>
      <section class="guest-mola-panel" aria-labelledby="guest-mola-title">
        <div class="guest-mola-header" id="guest-mola-title"><span class="guest-mola-star">✦</span><span>یک جمله مهمان مولا</span><span class="guest-mola-star">✦</span></div>
        <div class="guest-mola-window" aria-label="جمله‌های مهمان مولا">
          <div class="guest-mola-track"><div class="guest-mola-group">${guestCards}</div><div class="guest-mola-group" aria-hidden="true">${guestCards}</div></div>
        </div>
        <div class="guest-mola-note">این قاب برای افزودن عکس‌ها و نوشته‌های نهایی مهمانان مولا آماده است.</div>
      </section>
    </div>`;
  document.getElementById('about-biography').addEventListener('click',()=>setState('biography'));
  document.getElementById('about-contact').addEventListener('click',()=>openEitaa(CONTACT_URL));
  contents.querySelectorAll('[data-photo]').forEach(b=>b.addEventListener('click',()=>setState('photo',null,Number(b.dataset.photo))));
  contents.querySelectorAll('[data-guest]').forEach(b=>b.addEventListener('click',()=>toast('این بخش برای جمله‌های نهایی مهمان مولا آماده شده است.')));
}
function renderBiography(){
  contents.innerHTML='<article class="about-story">'+ABOUT_HTML+'</article>';
}
function renderPhoto(){
  const ix=Number.isInteger(item)&&item>=0&&item<USER_PHOTOS.length?item:0;
  contents.innerHTML=`<div class="photo-detail">
    <div class="photo-large-frame"><img src="${USER_PHOTOS[ix]}" alt="تصویر ${fa(ix+1)} از فعالیت‌های آموزشی"></div>
    <div class="photo-controls">
      <button type="button" id="photo-next" aria-label="تصویر بعدی">❮</button>
      <span class="photo-counter">${fa(ix+1)} از ${fa(USER_PHOTOS.length)}</span>
      <button type="button" id="photo-prev" aria-label="تصویر قبلی">❯</button>
    </div>
  </div>`;
  document.getElementById('photo-next').addEventListener('click',()=>setState('photo',null,(ix+1)%USER_PHOTOS.length));
  document.getElementById('photo-prev').addEventListener('click',()=>setState('photo',null,(ix-1+USER_PHOTOS.length)%USER_PHOTOS.length));
}

function renderPlayer(){
 const x=item; if(!x){setState('home');return}
 const match=String(x.url).match(/^https?:\/\/(?:www\.)?aparat\.com\/v\/([a-z0-9_-]+)/i);
 let html=`<div class="content-box"><h2>جلسه ${fa(x.number)}</h2>`;
 if(match){
  const embed='https://www.aparat.com/video/video/embed/videohash/'+encodeURIComponent(match[1])+'/vt/frame';
  html+=`<div class="player-frame"><iframe title="پخش آنلاین جلسه ${fa(x.number)}" src="${embed}" loading="eager" allowfullscreen allow="autoplay; fullscreen; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`;
 }else if(/eitaa\.com/i.test(x.url)){
  // Eitaa links are launched from the list directly; this is a fallback only.
  html+='<p class="player-note">این جلسه در ایتا قرار دارد.</p>';
 }else{
  html+='<a class="action"  href="'+safe(x.url)+'">باز کردن جلسه</a>';
 }
 html+='<button class="action" type="button" id="player-back">بازگشت به جلسات</button></div>';
 contents.innerHTML=html;
 document.getElementById('player-back').addEventListener('click',goBack);
}
function goBack(){if(screen==='biography'||screen==='photo')setState('about');else if(screen==='about')setState('home');else if(screen==='player'){const sec=section;setState('list',sec,'restore')}else if(screen==='list')setState('home');else toast('در صفحه اصلی هستید.');}
document.getElementById('home-about').addEventListener('click',()=>setState('about'));
document.querySelectorAll('[data-section]').forEach(b=>b.addEventListener('click',()=>setState('list',b.dataset.section)));
document.getElementById('back-button').addEventListener('click',goBack);
document.getElementById('search-button').addEventListener('click',()=>{
 if(screen==='about'||screen==='biography'||screen==='photo'){setState('list','towhid');searching=true;renderList();return;}
 if(screen==='player'){const sec=section;setState('list',sec);searching=true;renderList();return;}
 if(section==='nahj'||section==='clips'){toast('جست‌وجو در این بخش فعال نیست.');return}
 searching=!searching;query='';renderList();content.scrollTop=0;
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace'&&document.activeElement?.tagName!=='INPUT'&&document.activeElement?.tagName!=='TEXTAREA'){e.preventDefault();goBack();}});
render();
</script>
