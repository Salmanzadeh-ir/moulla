name: Build signed Bazaar APK 1.0.0 (never use debug)
on:
  push:
    branches:
      - feature/owner-online-content-updates-20261115
    paths:
      - .github/workflows/build-cafebazaar-signed-release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signed-bazaar-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch only (not frozen V16)
        uses: actions/checkout@v4

      - name: Verify the exact intended market version
        run: |
          set -euo pipefail
          grep -q "applicationId 'ir.nahj.towhidkarbordi'" app/build.gradle
          grep -q "versionCode 17" app/build.gradle
          grep -q "versionName '1.0.0'" app/build.gradle
          python3 scripts/verify_v16_preview.py
          node scripts/test_v16_back_navigation.js
          node scripts/test_pmm_online_updates.js
          node scripts/test_pmm_content_server.mjs --single-file

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore only the owner's historical signing keystore
        env:
          KEY_DATA: ${{ secrets.PMM_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.PMM_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEY_DATA" ] || [ -z "$KEY_PASSWORD" ]; then
            echo 'Owner must set PMM_KEYSTORE_BASE64 and PMM_KEYSTORE_PASSWORD in repository Actions Secrets.'
            exit 1
          fi
          umask 077
          printf '%s' "$KEY_DATA" | base64 --decode > "$RUNNER_TEMP/bazaar-release.p12"
          test -s "$RUNNER_TEMP/bazaar-release.p12"

      - name: Build actual signed Release APK (never Debug)
        env:
          PMM_KEYSTORE_PATH: ${{ runner.temp }}/bazaar-release.p12
          PMM_KEYSTORE_PASSWORD: ${{ secrets.PMM_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify package, version and historical official certificate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='ir.nahj.towhidkarbordi' versionCode='17' versionName='1.0.0'"
          mkdir -p "$RUNNER_TEMP/old-official"
          gh release download v10.4.9-official --repo "$GITHUB_REPOSITORY" --pattern 'PayeMenbareMola_V10_4_9_Official_Install.apk' --dir "$RUNNER_TEMP/old-official"
          OLD="$RUNNER_TEMP/old-official/PayeMenbareMola_V10_4_9_Official_Install.apk"
          echo "80cd77cdb6fbd967bfb7a3ccfde8d8ee598b4d675f2c4410fc7fda8d781d212b  $OLD" | sha256sum -c -
          OLD_CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$OLD" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          NEW_CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          test -n "$OLD_CERT" && test -n "$NEW_CERT"
          if [ "$OLD_CERT" != "$NEW_CERT" ]; then
            echo 'ERROR: certificate differs from v10.4.9 official. Refusing a Bazaar APK with incompatible signing.'
            exit 1
          fi
          echo 'PASS: APK signed with exact historical official certificate (not debug).'

      - name: Prepare APK and ZIP download artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/PayeMenbareMola-1.0.0-Bazaar-RELEASE.apk
          cd dist
          sha256sum PayeMenbareMola-1.0.0-Bazaar-RELEASE.apk > SHA256SUMS.txt
          python3 - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('PayeMenbareMola-1.0.0-Bazaar-RELEASE.zip', 'w', ZIP_DEFLATED) as z:
              z.write('PayeMenbareMola-1.0.0-Bazaar-RELEASE.apk')
              z.write('SHA256SUMS.txt')
          PY
          sha256sum -c SHA256SUMS.txt

      - name: Make validated signed APK available for owner download
        uses: actions/upload-artifact@v4
        with:
          name: PMM-1.0.0-17-Bazaar-SIGNED-RELEASE
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Delete temporary private keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/bazaar-release.p12"
