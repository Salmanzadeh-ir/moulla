name: Verify owner-approved active v119 reminders and preserve V118/V117/V16/V10.4.9
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-ui-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active owner-approved v119 reminder source
        uses: actions/checkout@v4
      - name: Check every active application file against v119 owner lock
        run: python3 scripts/verify_owner_v119_lock.py
      - name: Check active course JavaScript parsing and existing Back regression
        run: |
          node --check app/src/main/assets/pmm_offline_course.js
          node scripts/test_v16_back_navigation.js
          node scripts/test_owner_v118_back_notes.cjs
      - name: Check reminder schedule and JS state across updates
        run: |
          mkdir -p "$RUNNER_TEMP/pmm-clock"
          javac -d "$RUNNER_TEMP/pmm-clock" app/src/main/java/ir/nahj/towhidkarbordi/PmmReminderClock.java scripts/TestReminderClock.java
          java -cp "$RUNNER_TEMP/pmm-clock" TestReminderClock
          node scripts/test_course_state_compat.js
          bash scripts/test_native_compile.sh
      - name: Checkout owner-approved v118 historical reference
        uses: actions/checkout@v4
        with:
          ref: 0fce031b91ffd90893482dba664a8bd0704fac98
          path: preserved-v118
      - name: Verify unchanged v118 reference
        working-directory: preserved-v118
        run: python3 scripts/verify_owner_v118_lock.py
      - name: Checkout historic owner-frozen v117 main
        uses: actions/checkout@v4
        with:
          ref: snapshot/owner-v117-final-frozen-main-20261119
          path: preserved-v117
      - name: Validate 180 historical v117 files against original immutable lock
        working-directory: preserved-v117
        run: python3 scripts/verify_owner_v117_lock.py
      - name: Checkout the preserved old main V16 reference
        uses: actions/checkout@v4
        with:
          ref: snapshot/owner-main-before-v117-20261119
          path: preserved-v16
      - name: Validate historical frozen V16 as history, not as active v117
        working-directory: preserved-v16
        run: |
          python3 scripts/verify_v16_preview.py
          python3 scripts/verify_current_preview_lock.py
          python3 scripts/verify_v16_owner_reference.py
      - name: Checkout historical official V10.4.9 tag without modification
        uses: actions/checkout@v4
        with:
          ref: v10.4.9
          path: preserved-v10-4-9
      - name: Validate V10.4.9 historical approved source and APK binary
        working-directory: preserved-v10-4-9
        run: python3 scripts/verify_layout_lock.py
