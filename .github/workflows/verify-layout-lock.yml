name: Verify owner-approved V16 sections and historical 10.4.9
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-ui-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active V16 preview
        uses: actions/checkout@v4
      - name: Validate every V16 section and its content
        run: python3 scripts/verify_v16_preview.py
      - name: Verify exact hashes and file set of all active app components
        run: python3 scripts/verify_current_preview_lock.py
      - name: Checkout untouched 10.4.9 historical tag
        uses: actions/checkout@v4
        with:
          ref: v10.4.9
          path: approved-v10-4-9
      - name: Verify V10.4.9 approved source and APK binary
        working-directory: approved-v10-4-9
        run: python3 scripts/verify_layout_lock.py
