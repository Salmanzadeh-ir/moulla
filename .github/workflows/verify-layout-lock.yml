name: Verify owner-approved V10.4.9 design lock

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ui-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved sources and binary references
        uses: actions/checkout@v4
      - name: Ensure every approved screen, image and original APK byte remains unchanged
        run: python3 scripts/verify_layout_lock.py
