name: Verify approved V10.4.6 design lock

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ui-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout owner-approved V10.4.6 code and all reference assets
        uses: actions/checkout@v4
      - name: Verify 77 app files and 10 original APK binary pieces
        run: python3 scripts/verify_layout_lock.py
