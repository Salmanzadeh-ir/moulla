# The only active/default trial builder. Historical workflows remain archival until off-repo backup.
name: Build ONLY current owner-approved main source (independent DEBUG)
on:
  workflow_dispatch:
    inputs:
      approve_debug_build:
        description: 'Owner authorizes independent v119 DEBUG trial from current main (NOT market release)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: pmm-single-active-main-debug
  cancel-in-progress: false
jobs:
  current-owner-debug:
    if: ${{ inputs.approve_debug_build == true && github.actor == 'Salmanzadeh-ir' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout exactly current main, not an obsolete branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Validate active-version owner declaration and complete app lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess
          p=json.loads(Path('design/owner-active-version.json').read_text(encoding='utf-8'))
          assert p['active_branch']=='main' and p['active_version']=='v119'
          assert p['active_app_files']==182
          assert p['active_lock']=='design/owner-v119-main-app-lock.json'
          assert not p['cleanup_authorized']
          print('Owner-approved active source:',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          PY
          test -z "$(git status --porcelain)"
          python3 scripts/verify_owner_v119_lock.py
          node --check app/src/main/assets/pmm_offline_course.js
          node scripts/test_v16_back_navigation.js
          node scripts/test_owner_v118_back_notes.cjs
          node scripts/test_course_state_compat.js
          mkdir -p "$RUNNER_TEMP/pmm-clock"
          javac -d "$RUNNER_TEMP/pmm-clock" app/src/main/java/ir/nahj/towhidkarbordi/PmmReminderClock.java scripts/TestReminderClock.java
          java -cp "$RUNNER_TEMP/pmm-clock" TestReminderClock
          bash scripts/test_native_compile.sh
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Android SDK platform and tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Verify installed Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - name: Set unique independent DEBUG installation identity ONLY in runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          run_id=os.environ['GITHUB_RUN_ID']
          assert run_id.isdigit()
          p=Path('app/build.gradle')
          s=p.read_text(encoding='utf-8')
          edits={
              "applicationIdSuffix '.newiwanv16'":"applicationIdSuffix '.ownertrial"+run_id+"'",
              "versionCode 16":"versionCode 119",
              "versionName '10.5.4-v16-preview'":"versionName '10.5.11-owner-v119-trial-"+run_id+"'",
          }
          for old,new in edits.items():
              assert s.count(old)==1, 'Unexpected Gradle declaration: '+old
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as e:
              e.write('PMM_TRIAL_PACKAGE=ir.nahj.towhidkarbordi.ownertrial'+run_id+'\n')
              e.write('PMM_TRIAL_VERSION=10.5.11-owner-v119-trial-'+run_id+'-debug\n')
          PY
          test "$(git diff --name-only)" = app/build.gradle
          git diff --check
      - name: Compile unsigned-market-safe independent DEBUG
        shell: bash
        run: |
          set -euo pipefail
          env -u PMM_KEYSTORE_PATH -u PMM_KEYSTORE_PASSWORD gradle --no-daemon :app:assembleDebug
      - name: Verify APK signature, identity, ZIP alignment and SHA256
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          bt="$ANDROID_HOME/build-tools/35.0.0"
          "$bt/apksigner" verify --verbose "$apk"
          "$bt/zipalign" -c -v 4 "$apk"
          mkdir -p dist
          "$bt/aapt" dump badging "$apk" > dist/badging.txt
          grep -F "name='$PMM_TRIAL_PACKAGE'" dist/badging.txt
          grep -F "versionCode='119'" dist/badging.txt
          grep -F "versionName='$PMM_TRIAL_VERSION'" dist/badging.txt
          cp "$apk" dist/PayeMenbareMola-v119-single-active-DEBUG.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
          git restore -- app/build.gradle
          python3 scripts/verify_owner_v119_lock.py
          test -z "$(git status --porcelain)"
      - name: Upload APK ONLY as short-lived trial artifact, no market publication
        uses: actions/upload-artifact@v4
        with:
          name: PMM-current-main-independent-DEBUG-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
