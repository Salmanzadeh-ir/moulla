name: Owner trial - learning experience except unified search (DEBUG only)
on:
  push:
    branches:
      - feature/owner-learning-experience-except-search-20261117
  workflow_dispatch:

permissions:
  contents: write

jobs:
  owner-learning-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out isolated feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject unrelated changes to owner-frozen original assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          baseline="7467a3ac4445ba2a7bc16fcebe02c5f9068b2fa5"
          changed=set(subprocess.check_output(["git","diff","--name-only",baseline,"HEAD","--","app/"],text=True).splitlines())
          expected={
             "app/src/main/assets/index.html",
             "app/src/main/assets/pmm_learning_experience.js",
             "app/src/main/assets/pmm_learning_experience.css",
             "app/src/main/AndroidManifest.xml",
             "app/src/main/java/ir/nahj/towhidkarbordi/MainActivity.java",
             "app/src/main/java/ir/nahj/towhidkarbordi/PmmBackgroundAudioService.java",
             "app/src/main/java/ir/nahj/towhidkarbordi/PmmAudioDownloads.java",
          }
          assert changed==expected, f"Unapproved app scope change: {changed^expected}"
          print("PASS: only isolated owner-authorized learning enhancements changed app files")
          PY
          git diff --exit-code 7467a3ac4445ba2a7bc16fcebe02c5f9068b2fa5 HEAD -- app/src/main/assets/nahj_audio_links.js app/src/main/assets/hikam_bank.js app/src/main/assets/photo_quotes_manifest.js
      - name: Run Nahj, media, Kafi, listened-button and learning experience tests
        run: |
          node scripts/test_owner_nahj_numeric_search.cjs
          node scripts/test_owner_media_save.cjs
          node scripts/test_owner_kafi_mp3_catalog.cjs
          node scripts/test_owner_no_heard_and_kafi_tail.cjs
          node scripts/test_owner_learning_experience.cjs
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: SDK build tools 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Use Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Set independent debug package and filename ONLY in temporary runner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle")
          t=p.read_text()
          old="applicationIdSuffix '.remindtest107'"
          assert t.count(old)==1
          t=t.replace(old,"applicationIdSuffix '.learningtrial113'")
          old="versionNameSuffix '-debug'"
          assert t.count(old)==1
          t=t.replace(old,"versionNameSuffix '-learning-experience-trial-debug'")
          p.write_text(t)
          PY
      - name: Build independent Android debug APK
        run: |
          unset PMM_KEYSTORE_PATH PMM_KEYSTORE_PASSWORD
          gradle --no-daemon :app:assembleDebug
      - name: Verify APK identity, debug signature and checksum
        shell: bash
        run: |
          set -euo pipefail
          T="$ANDROID_HOME/build-tools/35.0.0"
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$T/apksigner" verify --verbose "$APK"
          "$T/aapt" dump badging "$APK" | grep -F "name='ir.nahj.towhidkarbordi.learningtrial113'"
          mkdir -p dist
          cp "$APK" dist/PayeMenbareMola-1.0.7-Learning-Enhancements-NO-SEARCH-TRIAL-DEBUG.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Upload recoverable test artifact
        uses: actions/upload-artifact@v4
        with:
          name: PMM-Owner-LearningEnhancements-NoSearch-Trial-DEBUG
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - name: Publish direct APK on separate download-only branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name='download/owner-learning-enhancements-no-search-r3-20261117'
          mkdir -p /tmp/pmm-owner-learning-trial
          cp dist/* /tmp/pmm-owner-learning-trial/
          cd /tmp/pmm-owner-learning-trial
          git init --initial-branch="$name"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Owner isolated learning enhancements debug trial from source $GITHUB_SHA"
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push origin "HEAD:refs/heads/$name"
