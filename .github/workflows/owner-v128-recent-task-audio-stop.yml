name: Owner v128 Recents audio stop with all v127 features locked - independent Android APK
on:
  push:
    branches: [feature/owner-v128-stop-audio-on-task-removal-20261120]
    paths:
      - .github/workflows/owner-v128-recent-task-audio-stop.yml
      - scripts/verify_owner_v128_full_lock.py
      - design/owner-v128-test-app-lock.json
      - app/src/main/java/ir/nahj/towhidkarbordi/PmmKafiAudioService.java
      - scripts/test_owner_v128_recent_task_audio.cjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  owner-test-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source 199-file exact lock; do not alter approved audio or other assets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_owner_v128_full_lock.py
          test -z "$(git status --porcelain)"
      - name: Test v128 Recents-stop and preserve all v127/v124 features
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test_owner_v128_recent_task_audio.cjs
          node scripts/test_owner_v124_seven_fixes.cjs
          node scripts/test_v16_back_navigation.js
          node scripts/test_owner_v118_back_notes.cjs
          node scripts/test_course_state_compat.js
          node scripts/test_owner_v122_content_startup.cjs
          node scripts/test_pmm_content_server.mjs
          node scripts/test_pmm_content_server.mjs --single-file
          node --check app/src/main/assets/pmm_unified_background_audio_v124.js
          node --check app/src/main/assets/pmm_offline_course.js
          mkdir -p "$RUNNER_TEMP/pmm-reminder-clock"
          javac -d "$RUNNER_TEMP/pmm-reminder-clock" app/src/main/java/ir/nahj/towhidkarbordi/PmmReminderClock.java scripts/TestReminderClock.java
          java -cp "$RUNNER_TEMP/pmm-reminder-clock" TestReminderClock
          bash scripts/test_native_compile.sh
          python3 scripts/verify_owner_v128_full_lock.py
          echo 'PASS: Recents close stops audio; all 199 files remain locked except owner-approved Java service'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Independent owner review app ID and version - RUNNER ONLY
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          text=p.read_text(encoding='utf-8')
          for a,b in {
           "applicationIdSuffix '.newiwanv16'":"applicationIdSuffix '.ownertaskstop128'",
           "versionCode 16":"versionCode 128",
           "versionName '10.5.4-v16-preview'":"versionName '10.5.20-owner-task-stop128'",
          }.items():
           assert text.count(a)==1,(a,text.count(a))
           text=text.replace(a,b,1)
          p.write_text(text,encoding='utf-8')
          PY
          test "$(git diff --name-only)" = "app/build.gradle"
      - name: Build independent signed DEBUG Android APK
        shell: bash
        run: |
          set -euo pipefail
          env -u PMM_KEYSTORE_PATH -u PMM_KEYSTORE_PASSWORD gradle --no-daemon :app:assembleDebug
      - name: Verify signed APK, manifest identity, font license and SHA256
        shell: bash
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME/build-tools/35.0.0"
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$sdk/apksigner" verify --verbose --print-certs "$apk"
          "$sdk/zipalign" -c -v 4 "$apk"
          mkdir -p dist
          "$sdk/aapt" dump badging "$apk" > dist/APK-PACKAGE.txt
          grep -F "name='ir.nahj.towhidkarbordi.ownertaskstop128'" dist/APK-PACKAGE.txt
          grep -F "versionCode='128'" dist/APK-PACKAGE.txt
          grep -F "versionName='10.5.20-owner-task-stop128-debug'" dist/APK-PACKAGE.txt
          unzip -Z1 "$apk" | grep -Fqx 'assets/fonts/Lalezar-Regular.ttf'
          unzip -Z1 "$apk" | grep -Fqx 'assets/fonts/Lalezar-OFL.txt'
          unzip -Z1 "$apk" | grep -Fqx 'assets/images/photo_quotes/quote_105.jpg'
          unzip -Z1 "$apk" | grep -Fqx 'assets/pmm_unified_background_audio_v124.js'
          if unzip -Z1 "$apk" | grep -Fqx 'assets/pmm_owner_wisdom_tools_v121.js'; then
            echo 'FAIL: unrequested Tafal wisdom module has returned'; exit 1
          fi
          cp "$apk" dist/PayeMenbareMola-v128-RECENTS-STOP-OWNER-TEST-DEBUG.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          # Full immutable Git source archive includes ALL app/java/assets/scripts/docs/locks,
          # never release signing keys, built APKs, Gradle outputs or external secrets.
          git archive --format=zip --output=dist/PayeMenbareMola-v128-COMPLETE-TESTED-SOURCE.zip HEAD
          unzip -tq dist/PayeMenbareMola-v128-COMPLETE-TESTED-SOURCE.zip
          unzip -Z1 dist/PayeMenbareMola-v128-COMPLETE-TESTED-SOURCE.zip | grep -Fqx "design/owner-v128-test-app-lock.json"
          unzip -Z1 dist/PayeMenbareMola-v128-COMPLETE-TESTED-SOURCE.zip | grep -Fqx "app/src/main/assets/index.html"
          unzip -Z1 dist/PayeMenbareMola-v128-COMPLETE-TESTED-SOURCE.zip | grep -Fqx "app/src/main/assets/fonts/Lalezar-Regular.ttf"
          (cd dist && sha256sum *.zip >> SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          git restore -- app/build.gradle
          python3 scripts/verify_owner_v128_full_lock.py
          git diff --exit-code -- app/
          test -z "$(git ls-files --others --exclude-standard -- app/src/)"
          git rev-parse HEAD > dist/SOURCE-COMMIT.txt
          printf 'OWNER TRIAL v128 ONLY: Recents swipe stops native audio after synchronously saving progress; Home/Back background audio preserved. All v127/v124 features unchanged. No official market release.\n' > dist/README.txt
          cat dist/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          echo "Exact source commit $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: PayeMenbareMola-v128-RECENTS-STOP-OWNER-TEST-${{ github.run_id }}
          path: dist/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Preserve public APK and complete source in 40 MiB parts with SHA verification
        shell: bash
        run: |
          set -euo pipefail
          apk="${{ github.workspace }}/dist/PayeMenbareMola-v128-RECENTS-STOP-OWNER-TEST-DEBUG.apk"
          zip="${{ github.workspace }}/dist/PayeMenbareMola-v128-COMPLETE-TESTED-SOURCE.zip"
          sums="${{ github.workspace }}/dist/SHA256SUMS.txt"
          dir="$(mktemp -d)"
          mkdir -p "$dir/downloads/v128"
          cp "$apk" "$sums" "$dir/downloads/v128/"
          # Never push a Git blob larger than GitHub's 100 MiB limit.
          split -b 40m -d -a 2 "$zip" \
            "$dir/downloads/v128/PayeMenbareMola-v128-COMPLETE-TESTED-SOURCE.zip.part"
          (
            cd "$dir/downloads/v128"
            sha256sum PayeMenbareMola-v128-COMPLETE-TESTED-SOURCE.zip.part* > SHA256SUMS-SOURCE-PARTS.txt
            sha256sum -c SHA256SUMS-SOURCE-PARTS.txt
            cat PayeMenbareMola-v128-COMPLETE-TESTED-SOURCE.zip.part* > "$dir/rejoined.zip"
            cmp "$zip" "$dir/rejoined.zip"
            unzip -tq "$dir/rejoined.zip"
          )
          cd "$dir"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "download/owner-v128-recents-stop-owner-test-${{ github.run_id }}"
          git add downloads/v128/
          git commit -qm "archive(v128): signed Debug APK and three exact-hash source parts"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push origin "HEAD:refs/heads/download/owner-v128-recents-stop-owner-test-${{ github.run_id }}"
          base="https://raw.githubusercontent.com/${{ github.repository }}/download/owner-v128-recents-stop-owner-test-${{ github.run_id }}/downloads/v128"
          url="$base/PayeMenbareMola-v128-RECENTS-STOP-OWNER-TEST-DEBUG.apk"
          expected="$(awk '/FINAL-OWNER-TEST-DEBUG.apk/{print $1}' "$sums")"
          verified=no
          for i in 1 2 3 4 5 6; do
            if curl --fail --location --silent --show-error --max-time 90 "$url" -o /tmp/pmm-v128-direct.apk; then
              actual="$(sha256sum /tmp/pmm-v128-direct.apk | cut -d' ' -f1)"
              if test "$actual" = "$expected"; then verified=yes; break; fi
            fi
            sleep 4
          done
          test "$verified" = yes
          echo "PASS: Verified public direct APK: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "APK SHA-256: $expected" >> "$GITHUB_STEP_SUMMARY"
          expected_source="$(awk '/COMPLETE-TESTED-SOURCE.zip/{print $1}' "$sums")"
          rm -f /tmp/pmm-v128-verified-source.zip
          for part in "$dir"/downloads/v128/PayeMenbareMola-v128-COMPLETE-TESTED-SOURCE.zip.part*; do
            filename="$(basename "$part")"
            echo "Checking public chunk: $filename"
            curl --fail --retry 4 --retry-delay 3 --location --silent --show-error --max-time 120 \
              "$base/$filename" -o /tmp/pmm-v128-part.bin
            cmp "$part" /tmp/pmm-v128-part.bin
            cat /tmp/pmm-v128-part.bin >> /tmp/pmm-v128-verified-source.zip
          done
          actual_source="$(sha256sum /tmp/pmm-v128-verified-source.zip | cut -d' ' -f1)"
          test "$actual_source" = "$expected_source"
          unzip -tq /tmp/pmm-v128-verified-source.zip
          echo "PASS: Public source parts rejoined byte-for-byte; complete source SHA-256 verified." >> "$GITHUB_STEP_SUMMARY"
          echo "Full source SHA-256: $expected_source" >> "$GITHUB_STEP_SUMMARY"
          echo "A single-ZIP source download is available via GitHub's commit archive route." >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$url" > "${{ github.workspace }}/dist/DIRECT-APK-VERIFIED.txt"
