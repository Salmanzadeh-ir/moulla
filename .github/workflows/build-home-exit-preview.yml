name: Build Home Exit Preview APK

on:
  push:
    branches:
      - feature/home-exit-preview-v10-4
    paths:
      - 'app/**'
      - '.github/workflows/build-home-exit-preview.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build signed debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK signing and package information
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -8
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: PayeMenbareMola-HomeExit-Preview-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
