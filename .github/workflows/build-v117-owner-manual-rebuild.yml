# Owner-authorized v117 source rebuild only. No v111-v117 patch replay.
# Manual trigger; actor restricted to owner. No official signing or release changes.
name: PMM v117 owner-only frozen-source trial rebuild
'on':
  workflow_dispatch:
    inputs:
      approve_build:
        description: Owner explicitly authorizes an independent DEBUG APK build
        required: true
        type: boolean
        default: false
      publish_direct:
        description: Publish to a NEW unique download branch after successful verification
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: owner-v117-safe-rebuild
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.approve_build == true && github.actor == 'Salmanzadeh-ir' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact frozen v117 main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 3c2ab679576337fb6a35786f88d8b737d4366a7b
          persist-credentials: false
      - name: Verify source lock before any runner-only edit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 3c2ab679576337fb6a35786f88d8b737d4366a7b
          python3 scripts/verify_owner_v117_lock.py
          node scripts/test_v16_back_navigation.js
          node --check app/src/main/assets/pmm_offline_course.js
          test -z "$(git status --porcelain)"
      - name: Install Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: '8.7'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35 and Build Tools 35.0.0
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - name: Apply isolated Debug identity in temporary runner only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text(encoding='utf-8')
          run_id=os.environ['GITHUB_RUN_ID']
          run_no=int(os.environ['GITHUB_RUN_NUMBER'])
          assert run_id.isdigit() and 0 < run_no < 1000000000
          assert s.count("applicationId 'ir.nahj.towhidkarbordi'")==1
          expected={
            "applicationIdSuffix '.newiwanv16'": "applicationIdSuffix '.ownertrial"+run_id+"'",
            "versionCode 16": "versionCode "+str(1000000+run_no),
            "versionName '10.5.4-v16-preview'": "versionName '10.5.9-owner-v117-rebuild-"+run_id+"'",
          }
          for old,new in expected.items():
              assert s.count(old)==1, "Unexpected frozen Gradle declaration: "+old
              s=s.replace(old,new,1)
          # Never edit release signing, applicationId or any other source file.
          p.write_text(s,encoding='utf-8')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as env:
              env.write('PMM_PACKAGE=ir.nahj.towhidkarbordi.ownertrial'+run_id+'\n')
              env.write('PMM_CODE='+str(1000000+run_no)+'\n')
              env.write('PMM_VERSION=10.5.9-owner-v117-rebuild-'+run_id+'-debug\n')
              env.write('PMM_RUN_ID='+run_id+'\n')
          PY
          git diff --check
          test "$(git diff --name-only)" = app/build.gradle
      - name: Build independent Debug APK without keystore secrets
        shell: bash
        run: |
          set -euo pipefail
          env -u PMM_KEYSTORE_PATH -u PMM_KEYSTORE_PASSWORD gradle --no-daemon :app:assembleDebug
      - name: Check actual APK signature, identity, ZIP alignment and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          bt="$ANDROID_HOME/build-tools/35.0.0"
          "$bt/apksigner" verify --verbose "$apk"
          "$bt/zipalign" -c -v 4 "$apk"
          mkdir -p dist
          "$bt/aapt" dump badging "$apk" > dist/badging.txt
          grep -F "name='${PMM_PACKAGE}'" dist/badging.txt
          grep -F "versionCode='${PMM_CODE}'" dist/badging.txt
          grep -F "versionName='${PMM_VERSION}'" dist/badging.txt
          cp "$apk" "dist/PayeMenbareMola-v117-ownertrial-${PMM_RUN_ID}-DEBUG.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Archive verified trial APK and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pmm-v117-verified-trial-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    needs: build
    if: ${{ inputs.approve_build == true && inputs.publish_direct == true && github.actor == 'Salmanzadeh-ir' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository for new download-only ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 3c2ab679576337fb6a35786f88d8b737d4366a7b
          fetch-depth: 1
      - name: Download only the verified build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pmm-v117-verified-trial-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Publish to a new ref; never overwrite older download branches
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS.txt)
          branch="download/owner-v117-rebuild-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
            echo "Existing download branch - refusing overwrite" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/pmm-verified"
          cp dist/*.apk dist/SHA256SUMS.txt "$RUNNER_TEMP/pmm-verified/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan "$branch"
          git ls-files -z | xargs -0 -r git rm -rf --
          mkdir -p downloads/v117-rebuild
          cp "$RUNNER_TEMP/pmm-verified/"* downloads/v117-rebuild/
          git add downloads/v117-rebuild/
          git commit -m "Publish verified trial from GitHub run ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$branch"
          echo "Verified APK destination: $branch" >> "$GITHUB_STEP_SUMMARY"
