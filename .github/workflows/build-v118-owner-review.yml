name: PMM v118 owner-approved UI and notes trial APK
'on':
  push:
    branches:
      - feature/owner-v118-back-text-linked-notes-preview-20261119
    paths:
      - .github/workflows/build-v118-owner-review.yml
permissions:
  contents: read
concurrency:
  group: pmm-v118-owner-review-apk
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Salmanzadeh-ir/moulla'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - name: Checkout approved trial branch at exact triggering commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify only the two owner-approved app files differ from frozen v117
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          lock=json.loads(Path('design/owner-v117-main-app-lock.json').read_text(encoding='utf-8'))
          expected=lock['files']
          assert len(expected)==180 and lock['approved_app_files_count']==180
          tracked={x.decode() for x in subprocess.check_output(['git','ls-files','-z','--','app/']).split(b'\0') if x}
          assert tracked==set(expected),(sorted(tracked-set(expected)),sorted(set(expected)-tracked))
          approved={
            'app/src/main/assets/index.html':'759056c5b8cb6cad399b1eebf5551106b89b4742',
            'app/src/main/assets/pmm_offline_course.js':'274b15a07e941dba8ea460e17f1aa3cf5d2bc3ba',
          }
          for path,original in expected.items():
              buf=Path(path).read_bytes()
              blob=hashlib.sha1(b'blob '+str(len(buf)).encode()+b'\0'+buf).hexdigest()
              want=approved.get(path,original)
              assert blob==want,(path,blob,want)
          print('PASS: 178 original v117 app files unchanged; only 2 authorized source files revised')
          PY
          node --check app/src/main/assets/pmm_offline_course.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          import tempfile, subprocess
          html=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          code=[x for x in re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,flags=re.I) if x.strip()]
          assert code
          with tempfile.TemporaryDirectory() as tmp:
              for i,part in enumerate(code):
                  dest=Path(tmp)/f'embedded-{i}.js'
                  dest.write_text(part,encoding='utf-8')
                  subprocess.run(['node','--check',str(dest)],check=True)
          for must in (
              "font-family:'PMM Estedad'",
              'id="course-note-toggle"',
              'id="course-notes-open"',
              'id="legacy-back-top"',
              'id="back-top"',
              'id="guest-return"',
              'id="course-notes-items"',
              'releaseNahjInlineStream',
          ):
              assert must in html, must
          course=Path('app/src/main/assets/pmm_offline_course.js').read_text(encoding='utf-8')
          assert "const entries=Object.entries(state.notes)" in course
          assert "class=\"course-saved-note-text\"" in course
          assert "showTrack(found.track,found.index,true)" in course
          assert "audio.removeAttribute('src');audio.load(); // Abort buffering when leaving the course." in course
          print('PASS: all embedded JavaScript, return labels and note-to-audio hooks')
          PY
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use existing Android SDK command-line tools on hosted runner
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          command -v sdkmanager
          test -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" || command -v sdkmanager
      - name: Install SDK platform 35 and Build Tools 35.0.0
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply isolated trial-only debug package metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text(encoding='utf-8')
          pairs=[
            ("applicationIdSuffix '.newiwanv16'","applicationIdSuffix '.ownerreview118'"),
            ("versionCode 16","versionCode 35"),
            ("versionName '10.5.4-v16-preview'","versionName '10.5.10-owner-review-118'"),
          ]
          for old,new in pairs:
              assert s.count(old)==1,(old,s.count(old))
              s=s.replace(old,new,1)
          assert s.count("applicationId 'ir.nahj.towhidkarbordi'")==1
          p.write_text(s,encoding='utf-8')
          PY
          test "$(git diff --name-only)" = "app/build.gradle"
          git diff --check
      - name: Compile standalone unsigned-for-release DEBUG APK
        shell: bash
        run: |
          set -euo pipefail
          env -u PMM_KEYSTORE_PATH -u PMM_KEYSTORE_PASSWORD gradle --no-daemon :app:assembleDebug
      - name: Verify real APK package, signing, alignment and checksums
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          bt="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$apk"
          "$bt/apksigner" verify --verbose "$apk"
          "$bt/zipalign" -c -v 4 "$apk"
          "$bt/aapt" dump badging "$apk" > "$RUNNER_TEMP/pmm-badging.txt"
          grep -F "name='ir.nahj.towhidkarbordi.ownerreview118'" "$RUNNER_TEMP/pmm-badging.txt"
          grep -F "versionCode='35'" "$RUNNER_TEMP/pmm-badging.txt"
          grep -F "versionName='10.5.10-owner-review-118-debug'" "$RUNNER_TEMP/pmm-badging.txt"
          mkdir -p dist
          cp "$apk" "dist/PayeMenbareMola-v118-OWNER-REVIEW-DEBUG.apk"
          cp "$RUNNER_TEMP/pmm-badging.txt" dist/APK-PACKAGE-INFO.txt
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Retain verified APK and SHA-256 in workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PMM-v118-owner-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    if: github.repository == 'Salmanzadeh-ir/moulla'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout for standalone public trial-download branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: '${{ github.sha }}'
      - name: Download verified artifact from the same run
        uses: actions/download-artifact@v4
        with:
          name: PMM-v118-owner-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Publish verified APK to unique immutable download path
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS.txt)
          branch="download/owner-v118-ui-notes-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
            echo "Refusing to overwrite a previous trial download branch" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/pmm-published"
          cp dist/*.apk dist/SHA256SUMS.txt dist/APK-PACKAGE-INFO.txt "$RUNNER_TEMP/pmm-published/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan "$branch"
          git ls-files -z | xargs -0 -r git rm -rf --
          mkdir -p downloads/v118
          cp "$RUNNER_TEMP/pmm-published/"* downloads/v118/
          git add downloads/v118/
          git commit -m "trial(v118): publish verified owner preview APK for UI and notes"
          git push origin "HEAD:refs/heads/$branch"
          echo "Direct download: https://raw.githubusercontent.com/Salmanzadeh-ir/moulla/$branch/downloads/v118/PayeMenbareMola-v118-OWNER-REVIEW-DEBUG.apk" >> "$GITHUB_STEP_SUMMARY"
