name: Paye Menbare Mola — V16 Android Preview APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify locked source before assembling
        run: |
          python3 scripts/verify_v16_preview.py
          python3 scripts/verify_current_preview_lock.py
      - name: Assemble TEST APK (not an official release)
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify package and signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "ir.nahj.towhidkarbordi.newiwanv16"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: PayeMenbareMola-V16-TEST-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 20
