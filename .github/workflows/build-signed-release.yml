
name: Build SIGNED Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        env:
          KEY_DATA: ${{ secrets.PMM_KEYSTORE_BASE64 }}
        run: |
          umask 077
          test -n "$KEY_DATA"
          printf '%s' "$KEY_DATA" | base64 --decode > "$RUNNER_TEMP/release.p12"

      - name: Build signed APK
        env:
          PMM_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          PMM_KEYSTORE_PASSWORD: ${{ secrets.PMM_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PayeMenbareMola-Signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
