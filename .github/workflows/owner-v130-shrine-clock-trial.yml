name: Owner v130 SHRINE CLOCK - trial Android APK, exact source lock, no main merge
on:
  push:
    branches: [feature/owner-v130-shrine-clock-interactive-trial-20261120]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare-dial:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare cleaned CLOCK face once from owner's exact photographic source
        shell: bash
        run: |
          set -euo pipefail
          if test ! -f app/src/main/assets/images/pmm_shrine_clock_clean.webp; then
            python3 -m venv "$RUNNER_TEMP/pmm-clock-env"
            "$RUNNER_TEMP/pmm-clock-env/bin/pip" install --disable-pip-version-check pillow==12.3.0 numpy==2.3.5
            "$RUNNER_TEMP/pmm-clock-env/bin/python" scripts/generate_owner_v130_shrine_clock.py
            git add app/src/main/assets/images/pmm_shrine_clock_clean.webp
            git -c user.name='pmm-owner-trial-ci' -c user.email='pmm-owner-trial-ci@users.noreply.github.com' \
              commit -m 'trial(v130): generate hand-free shrine dial, unchanged architecture'
            git push origin 'HEAD:refs/heads/feature/owner-v130-shrine-clock-interactive-trial-20261120'
          fi
      - id: gate
        name: Build only when image and exact owner trial lock are committed
        shell: bash
        run: |
          if test -f app/src/main/assets/images/pmm_shrine_clock_clean.webp && \
             test -f design/owner-v130-test-app-lock.json; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Awaiting locked source; this step does NOT merge to main.' >> "$GITHUB_STEP_SUMMARY"
          fi

  build-trial-apk:
    needs: prepare-dial
    if: needs.prepare-dial.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact lock - ALL active app files; native reminder and audio unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_owner_v130_full_lock.py
          test -z "$(git status --porcelain)"
      - name: Test genuine interactive clock and all legacy features
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test_owner_v130_shrine_clock.cjs
          node scripts/test_owner_v129_touch97.cjs
          node scripts/test_owner_v128_recent_task_audio.cjs
          node scripts/test_owner_v124_seven_fixes.cjs
          node scripts/test_v16_back_navigation.js
          node scripts/test_owner_v118_back_notes.cjs
          node scripts/test_course_state_compat.js
          node scripts/test_owner_v122_content_startup.cjs
          node scripts/test_pmm_content_server.mjs
          node scripts/test_pmm_content_server.mjs --single-file
          node --check app/src/main/assets/pmm_shrine_clock_v130.js
          node --check app/src/main/assets/pmm_offline_course.js
          node --check app/src/main/assets/pmm_unified_background_audio_v124.js
          mkdir -p "$RUNNER_TEMP/pmm-reminder-clock"
          javac -d "$RUNNER_TEMP/pmm-reminder-clock" app/src/main/java/ir/nahj/towhidkarbordi/PmmReminderClock.java scripts/TestReminderClock.java
          java -cp "$RUNNER_TEMP/pmm-reminder-clock" TestReminderClock
          bash scripts/test_native_compile.sh
          python3 scripts/verify_owner_v130_full_lock.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Independent DEBUG application identity only in runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text(encoding='utf-8')
          edits={
           "applicationIdSuffix '.newiwanv16'":"applicationIdSuffix '.ownershrineclock130'",
           'versionCode 16':'versionCode 130',
           "versionName '10.5.4-v16-preview'":"versionName '10.5.22-owner-shrine-clock130'",
          }
          for old,new in edits.items():
           assert s.count(old)==1,(old,s.count(old))
           s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          test "$(git diff --name-only)" = 'app/build.gradle'
      - name: Assemble independent Android signed DEBUG APK
        shell: bash
        run: |
          set -euo pipefail
          env -u PMM_KEYSTORE_PATH -u PMM_KEYSTORE_PASSWORD gradle --no-daemon :app:assembleDebug
      - name: Verify APK, signed package identity, embedded source and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME/build-tools/35.0.0"
          apk='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          "$sdk/apksigner" verify --verbose --print-certs "$apk"
          "$sdk/zipalign" -c -v 4 "$apk"
          mkdir -p dist
          "$sdk/aapt" dump badging "$apk" > dist/APK-PACKAGE.txt
          grep -F "name='ir.nahj.towhidkarbordi.ownershrineclock130'" dist/APK-PACKAGE.txt
          grep -F "versionCode='130'" dist/APK-PACKAGE.txt
          grep -F "versionName='10.5.22-owner-shrine-clock130-debug'" dist/APK-PACKAGE.txt
          unzip -Z1 "$apk" | grep -Fqx 'assets/images/pmm_shrine_clock_clean.webp'
          unzip -Z1 "$apk" | grep -Fqx 'assets/pmm_shrine_clock_v130.js'
          unzip -Z1 "$apk" | grep -Fqx 'assets/pmm_unified_background_audio_v124.js'
          unzip -Z1 "$apk" | grep -Fqx 'assets/fonts/Lalezar-Regular.ttf'
          unzip -Z1 "$apk" | grep -Fqx 'assets/images/photo_quotes/quote_105.jpg'
          if unzip -Z1 "$apk" | grep -Fqx 'assets/pmm_owner_wisdom_tools_v121.js'; then
            echo 'FAIL: removed Wisdom module returned'; exit 1
          fi
          python3 - <<'PY'
          import json,hashlib,subprocess,zipfile
          lock=json.load(open('design/owner-v130-test-app-lock.json',encoding='utf8'))['files']
          apk='app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
           for target in ['index.html','pmm_offline_course.js','pmm_shrine_clock_v130.js','images/pmm_shrine_clock_clean.webp']:
            b=z.read('assets/'+target)
            path='app/src/main/assets/'+target
            sha=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
            assert lock[path]==sha,(target,sha)
          print('PASS: APK embeds exact locked clock markup/controller/photo and unchanged course storage')
          PY
          cp "$apk" dist/PayeMenbareMola-v130-SHRINE-CLOCK-OWNER-TEST-DEBUG.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          git archive --format=zip --output=dist/PayeMenbareMola-v130-COMPLETE-TESTED-SOURCE.zip HEAD
          unzip -tq dist/PayeMenbareMola-v130-COMPLETE-TESTED-SOURCE.zip
          (cd dist && sha256sum *.zip >> SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          git restore -- app/build.gradle
          python3 scripts/verify_owner_v130_full_lock.py
          git diff --exit-code -- app/
          git rev-parse HEAD > dist/SOURCE-COMMIT.txt
          printf 'TRIAL v130: owner shrine clock. App main/v129 is untouched. NO market release.\n' > dist/README.txt
          cat dist/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          echo "Trial source commit $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: PayeMenbareMola-v130-SHRINE-CLOCK-OWNER-TEST-${{ github.run_id }}
          path: dist/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Preserve independent direct APK on separate download branch; verify public SHA
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/pmm-v130-download"
          git worktree add --detach "$dir" HEAD
          (
            cd "$dir"
            git checkout -q -b "download/owner-v130-shrine-clock-trial-${{ github.run_id }}"
            mkdir -p downloads/v130
            cp "$GITHUB_WORKSPACE/dist/PayeMenbareMola-v130-SHRINE-CLOCK-OWNER-TEST-DEBUG.apk" \
               "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt" downloads/v130/
            git add downloads/v130/
            git -c user.name='pmm-owner-trial-ci' -c user.email='pmm-owner-trial-ci@users.noreply.github.com' \
              commit -qm 'archive(v130): independent owner test debug APK, exact SHA'
            git push origin "HEAD:refs/heads/download/owner-v130-shrine-clock-trial-${{ github.run_id }}"
          )
          url="https://raw.githubusercontent.com/${{ github.repository }}/download/owner-v130-shrine-clock-trial-${{ github.run_id }}/downloads/v130/PayeMenbareMola-v130-SHRINE-CLOCK-OWNER-TEST-DEBUG.apk"
          expected="$(sha256sum dist/PayeMenbareMola-v130-SHRINE-CLOCK-OWNER-TEST-DEBUG.apk | cut -d' ' -f1)"
          verified='no'
          for attempt in $(seq 1 12); do
            if curl --fail --location --silent --show-error --max-time 90 "$url" -o "$RUNNER_TEMP/pmm-v130-public.apk"; then
              actual="$(sha256sum "$RUNNER_TEMP/pmm-v130-public.apk" | cut -d' ' -f1)"
              if test "$actual" = "$expected"; then verified='yes'; break; fi
            fi
            sleep 5
          done
          test "$verified" = yes
          echo "DIRECT TRIAL APK SHA-256 verified: $expected" >> "$GITHUB_STEP_SUMMARY"
          echo "Trial direct URL: $url" >> "$GITHUB_STEP_SUMMARY"
