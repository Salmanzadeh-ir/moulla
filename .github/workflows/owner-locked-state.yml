name: Owner locked state – reject all unapproved repository changes
on:
  push:
    branches:
      - feature/owner-online-content-updates-20261115
      - snapshot/owner-trial-v1.0.7-20261116
  pull_request:
    branches:
      - feature/owner-online-content-updates-20261115
      - snapshot/owner-trial-v1.0.7-20261116
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-owner-frozen-tree:
    name: Verify owner-frozen repository snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify every original repository file is unchanged
        shell: bash
        run: |
          set -euo pipefail
          locked="02b52bd80235508aeb4527cd980e2af03ab4021d"
          git cat-file -e "${locked}^{commit}"
          excluded=(':(exclude)OWNER_LOCK.md' ':(exclude).github/workflows/owner-locked-state.yml')
          echo "Checking repo against approved owner snapshot: ${locked}"
          if ! git diff --quiet --no-ext-diff "${locked}" HEAD -- . "${excluded[@]}"; then
            echo "::error::Changes from the owner-approved frozen repository snapshot are prohibited without explicit owner permission."
            git diff --name-status --no-ext-diff "${locked}" HEAD -- . "${excluded[@]}"
            exit 1
          fi
          echo "PASS: all frozen application sections, online content, tests and repository files are unchanged."
