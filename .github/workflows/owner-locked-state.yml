name: Owner locked state – reject all unapproved repository changes
on:
  push:
    branches:
      - feature/owner-online-content-updates-20261115
      - snapshot/owner-trial-v1.0.7-20261116
      - snapshot/owner-approved-nahj-search-intro-v107-20261116
      - snapshot/owner-approved-media-gallery-v107-20261116
  pull_request:
    branches:
      - feature/owner-online-content-updates-20261115
      - snapshot/owner-trial-v1.0.7-20261116
      - snapshot/owner-approved-nahj-search-intro-v107-20261116
      - snapshot/owner-approved-media-gallery-v107-20261116
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-owner-frozen-tree:
    name: Verify owner-frozen repository snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify every file is frozen at owner-approved 1.0.7 media-gallery state
        shell: bash
        run: |
          set -euo pipefail
          locked="71e454a2a64fa286e675e4ad5d94c5d917804e8f"
          git cat-file -e "${locked}^{commit}"
          excluded=(':(exclude)OWNER_LOCK.md' ':(exclude).github/workflows/owner-locked-state.yml')
          echo "Checking repo against approved owner snapshot: ${locked}"
          if ! git diff --quiet --no-ext-diff "${locked}" HEAD -- . "${excluded[@]}"; then
            echo "::error::Changes from the owner-approved frozen repository snapshot are prohibited without explicit owner permission."
            git diff --name-status --no-ext-diff "${locked}" HEAD -- . "${excluded[@]}"
            exit 1
          fi
          echo "PASS: full owner-approved source tree matches frozen reference (except documented lock-maintenance files)."
      - name: Regression guard — Nahj search, About label, visibility and protected audio links
        run: node scripts/test_owner_nahj_numeric_search.cjs
      - name: Regression guard — media Gallery opt-in saving and owner originals
        run: node scripts/test_owner_media_save.cjs
