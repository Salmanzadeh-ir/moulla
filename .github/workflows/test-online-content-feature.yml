name: Validate owner-authorized online content feature without touching V16 baseline
on:
  push:
    branches:
      - feature/owner-online-content-updates-20261115
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce strict source-change scope
        run: |
          python3 - <<'PY'
          import subprocess
          allowed = {
            "app/build.gradle",
            "app/src/main/assets/index.html",
            "app/src/main/assets/fonts/Estedad-VF.woff2",
            "app/src/main/assets/fonts/Estedad-OFL.txt",
            "app/src/main/assets/nahj_audio_links.js",
            "app/src/main/assets/pmm_online_updates.js",
            "app/src/main/assets/pmm_online_updates.css",
            "app/src/main/java/ir/nahj/towhidkarbordi/MainActivity.java",
            "app/src/main/java/ir/nahj/towhidkarbordi/WisdomReminderScheduler.java",
            "app/src/main/java/ir/nahj/towhidkarbordi/WisdomReminderReceiver.java",
            "app/src/main/AndroidManifest.xml",
            "app/src/main/res/drawable/pmm_reminder_icon.xml"
          }
          output = subprocess.check_output(["git", "diff", "--name-only",
             "cbb58c0932ec94531e517652a08f29caffee5d8c", "HEAD", "--", "app/"],text=True)
          changed = set(output.splitlines())
          assert changed == allowed, f"Unexpected application changes: {changed ^ allowed}"
          print("PASS: only owner-approved development files and bundled Estedad/OFL changed.")
          PY

      - name: Verify historical V16 content still present
        run: python3 scripts/verify_v16_preview.py

      - name: Back and intentional Exit regression tests
        run: node scripts/test_v16_back_navigation.js

      - name: New update protocol and consent tests
        run: |
          node --check app/src/main/assets/pmm_online_updates.js
          node --check scripts/test_pmm_online_updates.js
          node --check online-content/worker.js
          node --check online-content/admin-page.js
          node scripts/test_pmm_online_updates.js
          node scripts/test_pmm_content_server.mjs
          node --check online-content/cloudflare-dashboard-single-file.js
          node scripts/test_pmm_content_server.mjs --single-file

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build ONLY a debug test APK (never label as official)
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload optional test binary for owner validation
        uses: actions/upload-artifact@v4
        with:
          name: PMM-Online-Updates-Prototype-DEBUG-NOT-OFFICIAL
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
