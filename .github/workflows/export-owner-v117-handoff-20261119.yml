name: Export read-only owner-approved v117 sources for next-chat handoff
on:
  push:
    branches:
      - transfer/owner-v117-handoff-20261119
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export-verified-v117:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout frozen main with full references
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify correct locked reference and historical snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3c2ab679576337fb6a35786f88d8b737d4366a7b"
          python3 scripts/verify_owner_v117_lock.py
          git cat-file -e "22ba3a952cc4e537b25bb731758ecc3c8b0bb965^{commit}"
          test "$(git rev-parse "22ba3a952cc4e537b25bb731758ecc3c8b0bb965^{commit}")" = "22ba3a952cc4e537b25bb731758ecc3c8b0bb965"
          git status --short
      - name: Export exact source archives and transfer index without modifying program
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --output=dist/PayeMenbareMola-v117-ACTIVE-MAIN-SOURCE.zip "3c2ab679576337fb6a35786f88d8b737d4366a7b"
          git archive --format=zip --output=dist/PayeMenbareMola-v117-EXACT-BUILD-SOURCE-SNAPSHOT.zip "22ba3a952cc4e537b25bb731758ecc3c8b0bb965"
          cat > dist/README-NEXT-CHAT-FA.md <<'EOF'
          # بسته انتقال کامل «پای منبر مولا» - ۱۹ نوامبر ۲۰۲۶
          
          ## مهم: تفاوت دو سورس
          - PayeMenbareMola-v117-ACTIVE-MAIN-SOURCE.zip: وضعیت واقعی و فعال مخزن main در SHA 3c2ab679576337fb6a35786f88d8b737d4366a7b؛ شامل ۱۸۰ فایل قفل‌شده برنامه، همه مستندات و کنترل CI.
          - PayeMenbareMola-v117-EXACT-BUILD-SOURCE-SNAPSHOT.zip: منبع دقیق بازسازی‌شده v117 از GitHub Actions و قفل‌شده در SHA 22ba3a952cc4e537b25bb731758ecc3c8b0bb965؛ ۱۸۰ فایل برنامه و مشخصات پایه پروژه.
          - تفاوت مهم: فایل app/build.gradle در main عمداً همان شناسه و versionName قدیمی V16 را نگه داشته تا نسخه رسمی بازار تغییر نکند. برای ساخت APK آزمایشی با هویت v117، این فایل فقط در محیط موقت اجرای GitHub Actions تغییر می‌کند؛ هرگز بدون اجازه صاحب پروژه در main تغییر ندهید.
          
          ## وضعیت قفل و مالکیت
          - مخزن: https://github.com/Salmanzadeh-ir/moulla
          - شاخه فعال: main
          - مرجع نهایی پس از قفل: snapshot/owner-v117-final-frozen-main-20261119
          - مرجع سورس دقیق ساخت: snapshot/owner-v117-frozen-source-20261119
          - مرجع قبل از ادغام v117: snapshot/owner-main-before-v117-20261119
          - فهرست ۱۸۰ اثر انگشت: design/owner-v117-main-app-lock.json
          - دستور قفل: OWNER_LOCK.md و AGENTS.md
          - آزمون: python3 scripts/verify_owner_v117_lock.py
          - آزمون موفق پس از ادغام: https://github.com/Salmanzadeh-ir/moulla/actions/runs/44506253476
          - ساخت موفق APK آزمایشی v117: https://github.com/Salmanzadeh-ir/moulla/actions/runs/44502443550
          - APK v117 قبلی: https://raw.githubusercontent.com/Salmanzadeh-ir/moulla/download/owner-back-icons-reminder-v117-trial-20261119/downloads/v117/PayeMenbareMola-v117-BACK-ICONS-REMINDER-TRIAL-DEBUG.apk
          - SHA-256 APK قبلی: 3e491c0b1953d6e34b0fc751ad1bf03c770286e68d577f92cdade26bd7827240
          - شاخه main دارای قفل اثر انگشت و CI است، ولی GitHub Rulesets برای جلوگیری اجباری از تغییرات هنوز فعال نشده.
          
          ## ساخت آزمایشی جدید در چت بعدی
          1. قبل از هر کاری گزارش، AGENTS.md، OWNER_LOCK.md، design/owner-v117-main-app-lock.json و هر دو سورس را مطالعه کنید. هیچ تغییری در main، release، tags، snapshots یا کلید امضا بدون اجازه صریح مالک انجام ندهید.
          2. در شاخه آزمایشی تازه، از main یا snapshot قفل‌شده نسخه بگیرید و برای تست، Java 17، Android SDK 35، Build Tools 35.0.0 و Gradle 8.7 را در GitHub Actions آماده کنید.
          3. پیش از ساخت، صحت تمام ۱۸۰ فایل برنامه را با scripts/verify_owner_v117_lock.py روی منبع main بررسی کنید.
          4. فقط در workspace ساخت، مقدار debug applicationIdSuffix را به مقدار جدید یکتا (مثلاً .trial118) و versionCode/versionName آزمایشی را به مقدار جدید تغییر دهید. با نمونه موجود در .github/workflows/build-owner-back-icons-reminder-v117-trial.yml در شاخه feature/owner-back-icons-reminder-v117-trial مقایسه کنید. به هویت رسمی، رمز یا keystore دست نزنید.
          5. gradle --no-daemon :app:assembleDebug را اجرا کنید؛ پس از موفقیت، app/build/outputs/apk/debug/app-debug.apk را با apksigner، zipalign، aapt و sha256sum بررسی کنید.
          6. APK واقعی را به‌عنوان Artifact و برای دانلود مستقیم در شاخه تازه و منحصربه‌فرد download/<trial-name> منتشر کنید؛ نام شاخه دانلود v117 قبلی را دوباره استفاده نکنید، چون Workflow اصلی شرط خالی‌بودن آن شاخه را دارد.
          7. آزمایش روی گوشی واقعی را جداگانه انجام دهید. صرف موفقیت ساخت یا آزمون کد به معنی عملکرد تأییدشده گوشی نیست.
          8. اگر هیچ تغییر جدیدی از مالک درخواست نشده است، شاخه اصلی یا فایل‌های قفل را حتی برای تمیزکاری/بهینه‌سازی تغییر ندهید.
          
          ## دسترسی به تمام تاریخچه مخزن
          برای دریافت همه شاخه‌ها، تگ‌ها و تاریخچه، Git clone معمولی یا mirror انجام دهید:
          git clone https://github.com/Salmanzadeh-ir/moulla.git
          git clone --mirror https://github.com/Salmanzadeh-ir/moulla.git
          
          این دو ZIP خروجی git archive هستند؛ تمام فایل‌های ردیابی‌شده در commit مربوط را دارند، اما پوشه .git و تاریخچه همه شاخه‌ها داخل ZIP نیست. برای تاریخچه کامل از clone --mirror استفاده کنید.
          EOF
          cat > dist/REFERENCE-IDS.txt <<'EOF'
          main_sha=3c2ab679576337fb6a35786f88d8b737d4366a7b
          exact_built_snapshot_sha=22ba3a952cc4e537b25bb731758ecc3c8b0bb965
          final_frozen_main_snapshot=snapshot/owner-v117-final-frozen-main-20261119
          build_run=https://github.com/Salmanzadeh-ir/moulla/actions/runs/44502443550
          freeze_ci_run=https://github.com/Salmanzadeh-ir/moulla/actions/runs/44506253476
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import json,zipfile,hashlib
          files=[
            ('dist/PayeMenbareMola-v117-ACTIVE-MAIN-SOURCE.zip','design/owner-v117-main-app-lock.json'),
            ('dist/PayeMenbareMola-v117-EXACT-BUILD-SOURCE-SNAPSHOT.zip','design/owner-v117-frozen-app-lock.json')
          ]
          for zipname,lockname in files:
            with zipfile.ZipFile(zipname) as z:
              lock=json.loads(z.read(lockname))
              if 'files' not in lock:raise AssertionError(lockname)
              entries=lock['files']
              assert len(entries)==180,(zipname,len(entries))
              for rel,meta in entries.items() if isinstance(entries,dict) else ((o['path'],o) for o in entries):
                data=z.read(rel)
                gitsha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
                wanted=meta if isinstance(meta,str) else meta['blob_sha1']
                assert gitsha==wanted,(zipname,rel,gitsha,wanted)
              names=set(z.namelist())
              assert not any(name.lower().endswith(('.jks','.keystore','.p12','.pfx','.key')) for name in names)
              print('PASS exact locked file set:',zipname,'180 verified app files',len(names),'tracked paths')
          PY
          (cd dist && sha256sum PayeMenbareMola-v117-*.zip README-NEXT-CHAT-FA.md REFERENCE-IDS.txt > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          (cd dist && zip -0 -q PayeMenbareMola-v117-COMPLETE-TRANSFER-PACKAGE.zip PayeMenbareMola-v117-ACTIVE-MAIN-SOURCE.zip PayeMenbareMola-v117-EXACT-BUILD-SOURCE-SNAPSHOT.zip README-NEXT-CHAT-FA.md REFERENCE-IDS.txt SHA256SUMS.txt)
          (cd dist && sha256sum PayeMenbareMola-v117-COMPLETE-TRANSFER-PACKAGE.zip > OUTER-SHA256.txt && sha256sum -c OUTER-SHA256.txt)
          ls -lh dist/
      - name: Save source handoff archives as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: PayeMenbareMola-v117-complete-source-handoff
          path: dist/
          retention-days: 30
      - name: Publish verified sources on a separate handoff download branch
        shell: bash
        run: |
          set -euo pipefail
          destination=download/owner-v117-source-handoff-20261119
          test -z "$(git ls-remote --heads origin "refs/heads/$destination")"
          git switch -c "$destination"
          mkdir -p downloads/v117-handoff
          cp dist/PayeMenbareMola-v117-COMPLETE-TRANSFER-PACKAGE.zip downloads/v117-handoff/
          cp dist/PayeMenbareMola-v117-ACTIVE-MAIN-SOURCE.zip downloads/v117-handoff/
          cp dist/SHA256SUMS.txt dist/OUTER-SHA256.txt dist/README-NEXT-CHAT-FA.md downloads/v117-handoff/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/v117-handoff/
          git commit -m "docs(v117): publish exact read-only source archives and handoff checksums"
          git push origin "HEAD:refs/heads/$destination"
          echo "SOURCE_DOWNLOAD=https://raw.githubusercontent.com/Salmanzadeh-ir/moulla/$destination/downloads/v117-handoff/PayeMenbareMola-v117-ACTIVE-MAIN-SOURCE.zip" >> "$GITHUB_STEP_SUMMARY"
          echo "FULL_TRANSFER_DOWNLOAD=https://raw.githubusercontent.com/Salmanzadeh-ir/moulla/$destination/downloads/v117-handoff/PayeMenbareMola-v117-COMPLETE-TRANSFER-PACKAGE.zip" >> "$GITHUB_STEP_SUMMARY"
