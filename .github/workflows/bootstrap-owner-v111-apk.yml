      - name: Verify full protected owner-app lock and exact approved Kafi/Nahj content
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_owner_offline_course_v111_lock.py
          node scripts/test_owner_home_hierarchy_v111.cjs
          node scripts/test_owner_offline_course_v111.cjs
          node scripts/test_owner_kafi_resume_screenoff_v111.cjs
          node scripts/test_owner_kafi_mp3_catalog.cjs
          node scripts/test_owner_no_heard_and_kafi_tail.cjs
          node scripts/test_owner_nahj_numeric_search.cjs
          node scripts/test_owner_media_save.cjs
          node scripts/test_v16_back_navigation.js
          python3 scripts/verify_v16_preview.py
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          diff=set(subprocess.check_output(['git','diff','--name-only','1c2b4e9a759af24efb0b913352b0efdababcf8d9','--','app/'],text=True).splitlines())
          expected={'app/src/main/assets/index.html','app/src/main/assets/pmm_offline_course.js','app/src/main/assets/pmm_offline_course_logic.js'}
          diff.update(path for path in expected if Path(path).exists())
          assert diff==expected,diff ^ expected
          print('PASS: only three owner-authorized app files modified')
          PY

      - name: Record reconstructed complete owner-approved v111 source on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(owner): restore verified offline Nahj course v111 from uploaded approved source'
          git push origin HEAD:refs/heads/feature/owner-offline-nahj-course-v111-trial-20261118
          echo "APPROVED_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Android JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install API 35 and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Keep debug test app independently installable without any release signing secret
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          file=Path('app/build.gradle')
          source=file.read_text()
          for old,new in {
              "applicationIdSuffix '.remindtest107'":"applicationIdSuffix '.offlinecourse111'",
              "versionNameSuffix '-debug'":"versionNameSuffix '-offline-course-trial-debug'",
              "versionCode 26":"versionCode 28",
              "versionName '10.5.1'":"versionName '10.5.3'"
          }.items():
              assert source.count(old)==1,old
              source=source.replace(old,new)
          file.write_text(source)
          PY
          unset PMM_KEYSTORE_PATH PMM_KEYSTORE_PASSWORD
      - name: Build ACTUAL Android DEBUG APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify real installable signature, package, version, SDK and alignment
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/zipalign" -c -v 4 "$APK"
          "$BT/aapt" dump badging "$APK" | grep -F "package: name='ir.nahj.towhidkarbordi.offlinecourse111' versionCode='28' versionName='10.5.3-offline-course-trial-debug'"
          mkdir -p dist
          cp "$APK" dist/PayeMenbareMola-10.5.3-OFFLINE-NAHJ-COURSE-v111-TRIAL.apk
          printf 'Owner approved v111. Independent DEBUG test APK, not for Bazaar. Playback MP3 requires Internet; notes/progress saved locally. Source commit: %s\n' "$APPROVED_SOURCE_COMMIT" > dist/READ-FIRST.txt
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

      - name: Store APK for owner
        uses: actions/upload-artifact@v4
        with:
          name: PMM-v111-OFFLINE-NAHJ-COURSE-ANDROID-TRIAL
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Publish directly downloadable single APK on isolated download branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name='download/owner-offline-nahj-course-v111-20261119'
          mkdir -p /tmp/pmm-offline-v111-release
          cp dist/* /tmp/pmm-offline-v111-release/
          cd /tmp/pmm-offline-v111-release
          git init --initial-branch="$name"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Owner-approved v111 independently signed debug APK; source $APPROVED_SOURCE_COMMIT"
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push origin "HEAD:refs/heads/$name"
