name: Production V10.4.9 — signed APK and Play AAB

on:
  push:
    branches:
      - release/production-v10-4-9-from-approved-main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout and verify approved V10.4.9 screens unchanged
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert NO changes to approved UI, Android implementation and artwork
        shell: bash
        run: |
          git diff --exit-code 7ca6ed8b96d1dcd0ff798002be180c13135ae0c5 HEAD -- app/src/main
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          lock=json.loads(Path('design/v10.4.9-lock.json').read_text(encoding='utf-8'))
          expected=lock['protected_paths']['git_blob_sha_by_path']
          for name,sha in expected.items():
              if name in ('app/build.gradle',): continue
              actual=__import__('subprocess').check_output(['git','hash-object',name],text=True).strip()
              assert actual == sha, 'Owner-approved file changed: '+name
          print('Approved app screens and assets match owner reference.')
          PY
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API 36 platform and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Gradle 8.11.1 for Android Gradle Plugin 8.10.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build RELEASE binaries for signing with owner's long-term private key
        shell: bash
        run: gradle --no-daemon --stacktrace assembleRelease bundleRelease
      - name: Stage UNSIGNED binaries and Android's official apksigner tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          AAB=$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -print -quit)
          test -n "$APK" && test -n "$AAB"
          cp "$APK" output/owner-approved-v1049-release-UNSIGNED.apk
          cp "$AAB" output/owner-approved-v1049-release-UNSIGNED.aab
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" output/apksigner.jar
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee output/package-badging.txt
          grep -F "name='ir.nahj.towhidkarbordi'" output/package-badging.txt
          grep -F "versionCode='15'" output/package-badging.txt
          grep -F "targetSdkVersion:'36'" output/package-badging.txt
          sha256sum output/* | tee output/unsigned-SHA256SUMS.txt
      - name: Upload UNSIGNED release files for secure offline signing
        uses: actions/upload-artifact@v4
        with:
          name: PayeMenbareMola-v10.4.9-UNSIGNED-FOR-PRIVATE-SIGNING-ONLY
          path: output/
          retention-days: 1
          if-no-files-found: error
