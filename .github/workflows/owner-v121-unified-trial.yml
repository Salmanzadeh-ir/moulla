name: Owner v121 integrated candidate — 105 photos + optional offline wisdom (NOT FOR MAIN)
on:
  push:
    branches: [feature/owner-v121-unified-learning-safe-trial-20261120]
    paths:
      - .github/workflows/owner-v121-unified-trial.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-build:
    name: Freeze 195 files and build independent owner-trial Debug
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exactly owner-review candidate and historical tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable v119 main baseline and 195-file candidate lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = 12016838e98d8c1eadadbb0a96321f4855f1c5cd
          python3 - <<'PY'
          import hashlib,json,subprocess,pathlib
          from pathlib import Path
          run=lambda *args:subprocess.check_output(['git',*args],text=True).strip()
          current=json.loads(Path('design/owner-v121-trial-app-lock.json').read_text())
          v120=json.loads(Path('design/owner-v120-gallery-review-app-lock.json').read_text())
          approved=json.loads(Path('design/owner-v119-main-app-lock.json').read_text())
          assert current['status']=='CANDIDATE_NOT_OWNER_APPROVED_DO_NOT_MERGE_TO_MAIN'
          assert len(current['files'])==current['candidate_app_files_count']==195
          assert len(v120['files'])==194 and len(approved['files'])==182
          tracked=run('ls-files','--','app/').splitlines()
          assert len(tracked)==195 and set(tracked)==set(current['files'])
          def sha(path):
              raw=Path(path).read_bytes()
              return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          for path,expected in current['files'].items():
              assert sha(path)==expected,(path,'candidate file is not locked')
          for path,oldhash in v120['files'].items():
              if path!='app/src/main/assets/index.html':
                  assert sha(path)==oldhash,(path,'v120 approved-content drift')
          for path,oldhash in approved['files'].items():
              if path not in {'app/src/main/assets/index.html','app/src/main/assets/photo_quotes_manifest.js'}:
                  assert sha(path)==oldhash,(path,'v119 app drift')
          nums=[1,2,3,5,6,12,13,14,15,16,17,18]
          for ordinal,number in enumerate(nums,94):
              src='v10.4.9:app/src/main/assets/images/guest_album/%02d.jpg'%number
              expect=run('rev-parse',src)
              actual=sha('app/src/main/assets/images/photo_quotes/quote_%03d.jpg'%ordinal)
              assert expect==actual,(src,'historical image differs')
          assert not run('status','--porcelain')
          print('PASS: 195/195 exact app Git hashes; 182 approved v119 files unmodified except two planned entrypoints; 12 originals exact; no extra or missing app source.')
          PY
      - name: Test offline learning features, old data migrations and 105 gallery paths
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/pmm_owner_wisdom_tools_v121.js
          node scripts/test_owner_v121_wisdom_tools.cjs
          node scripts/test_v16_back_navigation.js
          node scripts/test_owner_v118_back_notes.cjs
          node scripts/test_course_state_compat.js
          node --check app/src/main/assets/pmm_offline_course.js
          node --check app/src/main/assets/photo_quotes_manifest.js
          mkdir -p "$RUNNER_TEMP/owner-reminder-classes"
          javac -d "$RUNNER_TEMP/owner-reminder-classes" app/src/main/java/ir/nahj/towhidkarbordi/PmmReminderClock.java scripts/TestReminderClock.java
          java -cp "$RUNNER_TEMP/owner-reminder-classes" TestReminderClock
          bash scripts/test_native_compile.sh
      - name: Install JDK 17 and Gradle 8.7
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android API 35 and Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Change only runner's DEBUG installation identity and version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('app/build.gradle')
          data=path.read_text()
          changes={
              "applicationIdSuffix '.newiwanv16'":"applicationIdSuffix '.ownerunifiedreview121'",
              "versionCode 16":"versionCode 121",
              "versionName '10.5.4-v16-preview'":"versionName '10.5.13-owner-unified-review-121'",
          }
          for before,after in changes.items():
              assert data.count(before)==1,('Unexpected Gradle declaration',before)
              data=data.replace(before,after,1)
          path.write_text(data)
          PY
          test "$(git diff --name-only)" = app/build.gradle
          git diff --check
      - name: Assemble independent v121 DEBUG APK without owner's release signing
        shell: bash
        run: |
          set -euo pipefail
          env -u PMM_KEYSTORE_PATH -u PMM_KEYSTORE_PASSWORD gradle --no-daemon :app:assembleDebug
      - name: Verify APK package/signature/ZIP/SHA and restore Git source unchanged
        shell: bash
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME/build-tools/35.0.0"
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$sdk/apksigner" verify --verbose --print-certs "$apk"
          "$sdk/zipalign" -c -v 4 "$apk"
          mkdir -p dist
          "$sdk/aapt" dump badging "$apk" > dist/APK-BADGING.txt
          grep -F "name='ir.nahj.towhidkarbordi.ownerunifiedreview121'" dist/APK-BADGING.txt
          grep -F "versionCode='121'" dist/APK-BADGING.txt
          grep -F "versionName='10.5.13-owner-unified-review-121-debug'" dist/APK-BADGING.txt
          unzip -Z1 "$apk" | grep -Fqx 'assets/pmm_owner_wisdom_tools_v121.js'
          unzip -Z1 "$apk" | grep -Fqx 'assets/images/photo_quotes/quote_105.jpg'
          cp "$apk" dist/PayeMenbareMola-v121-OWNER-UNIFIED-TRIAL-DEBUG.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          git restore -- app/build.gradle
          git diff --quiet -- app/
          test -z "$(git ls-files --others --exclude-standard -- app/src/)"
          git rev-parse HEAD > dist/SOURCE-COMMIT.txt
          printf 'Owner review ONLY; main still v119; official ID and release signing untouched.\n105 photo posters; 195 candidate app-file locks; optional authentic offline wisdom bookmarks/notes/topics.\nDo not merge or delete old refs before owner device acceptance and checksum-verified independent backup.\n' > dist/README.txt
          echo 'v121 trial APK successfully signed, aligned, verified, and locked; exact SHA:' >> "$GITHUB_STEP_SUMMARY"
          cat dist/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Publish only independent DEBUG artifact and verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: PayeMenbareMola-v121-OWNER-UNIFIED-TRIAL-${{ github.run_id }}
          path: dist/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
