name: Owner trial - Kafi Shenasi and 54 valid lessons (DEBUG only)
on:
  push:
    branches:
      - feature/owner-kafi-shenasi-54-sessions-trial-20261117
  workflow_dispatch:

# Only the owner-requested independent test. Never use release signing keys.
permissions:
  contents: write

jobs:
  gallery-save-trial:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout owner trial
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce owner source scope and protected originals
        shell: bash
        run: |
          set -euo pipefail
          BASE=a76e53518356760156285591344ecba7a5801e27
          python3 - <<'PY'
          import subprocess
          baseline="a76e53518356760156285591344ecba7a5801e27"
          actual=set(subprocess.check_output(
            ["git","diff","--name-only",baseline,"HEAD","--","app/"],text=True
          ).splitlines())
          expected={"app/src/main/assets/index.html"}
          assert actual==expected, "UNAUTHORIZED app changes: "+repr(actual^expected)
          print("PASS: only Kafi title/number/count adjustments to the app UI file changed.")
          PY
          git diff --exit-code "$BASE" HEAD -- app/src/main/assets/nahj_audio_links.js app/src/main/assets/hikam_bank.js app/src/main/assets/photo_quotes_manifest.js
          git diff --exit-code "$BASE" HEAD -- OWNER_LOCK.md .github/workflows/owner-locked-state.yml .github/CODEOWNERS
      - name: Validate standalone Kafi Shenasi, 54 sessions, and all prior approved features
        run: |
          node scripts/test_owner_nahj_numeric_search.cjs
          node scripts/test_owner_media_save.cjs
          node scripts/test_owner_kafi_mp3_catalog.cjs
          node scripts/test_owner_no_heard_and_kafi_tail.cjs
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: SDK 35 build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Use Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Isolate debug package ONLY in CI temporary checkout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle")
          text=p.read_text()
          before="applicationIdSuffix '.remindtest107'"
          assert text.count(before)==1
          text=text.replace(before,"applicationIdSuffix '.kafishenasitrial112'")
          before="versionNameSuffix '-debug'"
          assert text.count(before)==1
          text=text.replace(before,"versionNameSuffix '-kafi-shenasi-54-trial-debug'")
          p.write_text(text)
          PY
      - name: Build unsigned-for-store but signed-for-debug test APK
        run: |
          unset PMM_KEYSTORE_PATH PMM_KEYSTORE_PASSWORD
          gradle --no-daemon :app:assembleDebug
      - name: Verify debug signature, independent identity, checksum
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$TOOLS/apksigner" verify --verbose "$APK"
          "$TOOLS/aapt" dump badging "$APK" | grep -F "name='ir.nahj.towhidkarbordi.kafishenasitrial112'"
          mkdir -p dist
          cp "$APK" dist/PMM-1.0.7-KAFI-SHENASI-54-TRIAL-DEBUG.apk
          (cd dist && sha256sum PMM-1.0.7-KAFI-SHENASI-54-TRIAL-DEBUG.apk > SHA256SUMS.txt)
      - name: Publish recoverable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: PMM-Owner-KafiShenasi54-DEBUG-Trial
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Publish Kafi trial APK on a new download-only branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name='download/owner-kafi-shenasi-54-trial-20261117'
          mkdir -p /tmp/pmm-media-save-artifact
          cp dist/* /tmp/pmm-media-save-artifact/
          cd /tmp/pmm-media-save-artifact
          git init --initial-branch="$name"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Independent owner Kafi Shenasi and 54 sessions DEBUG trial from source $GITHUB_SHA"
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push origin "HEAD:refs/heads/$name"
