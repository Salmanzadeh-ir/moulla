name: Owner v129 approved main Touch97 - signed debug build and source lock
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/owner-v129-approved-touch97-main-20261120]
permissions:
  contents: read
jobs:
  owner-test-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source 199-file exact lock; do not alter approved audio or other assets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_owner_v129_main_lock.py
          test -z "$(git status --porcelain)"
      - name: Test all v129 Touch97, v128 Recents-stop and historic regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test_owner_v129_touch97.cjs
          node scripts/test_owner_v128_recent_task_audio.cjs
          node scripts/test_owner_v124_seven_fixes.cjs
          node scripts/test_v16_back_navigation.js
          node scripts/test_owner_v118_back_notes.cjs
          node scripts/test_course_state_compat.js
          node scripts/test_owner_v122_content_startup.cjs
          node scripts/test_pmm_content_server.mjs
          node scripts/test_pmm_content_server.mjs --single-file
          node --check app/src/main/assets/pmm_unified_background_audio_v124.js
          node --check app/src/main/assets/pmm_offline_course.js
          mkdir -p "$RUNNER_TEMP/pmm-reminder-clock"
          javac -d "$RUNNER_TEMP/pmm-reminder-clock" app/src/main/java/ir/nahj/towhidkarbordi/PmmReminderClock.java scripts/TestReminderClock.java
          java -cp "$RUNNER_TEMP/pmm-reminder-clock" TestReminderClock
          bash scripts/test_native_compile.sh
          python3 scripts/verify_owner_v129_main_lock.py
          echo 'PASS: Recents close stops audio; all 199 files remain locked except owner-approved Java service'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Independent owner review app ID and version - RUNNER ONLY
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          text=p.read_text(encoding='utf-8')
          for a,b in {
           "applicationIdSuffix '.newiwanv16'":"applicationIdSuffix '.ownerapproved129'",
           "versionCode 16":"versionCode 129",
           "versionName '10.5.4-v16-preview'":"versionName '10.5.21-owner-approved129'",
          }.items():
           assert text.count(a)==1,(a,text.count(a))
           text=text.replace(a,b,1)
          p.write_text(text,encoding='utf-8')
          PY
          test "$(git diff --name-only)" = "app/build.gradle"
      - name: Build independent signed DEBUG Android APK
        shell: bash
        run: |
          set -euo pipefail
          env -u PMM_KEYSTORE_PATH -u PMM_KEYSTORE_PASSWORD gradle --no-daemon :app:assembleDebug
      - name: Verify signed APK, manifest identity, font license and SHA256
        shell: bash
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME/build-tools/35.0.0"
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$sdk/apksigner" verify --verbose --print-certs "$apk"
          "$sdk/zipalign" -c -v 4 "$apk"
          mkdir -p dist
          "$sdk/aapt" dump badging "$apk" > dist/APK-PACKAGE.txt
          grep -F "name='ir.nahj.towhidkarbordi.ownerapproved129'" dist/APK-PACKAGE.txt
          grep -F "versionCode='129'" dist/APK-PACKAGE.txt
          grep -F "versionName='10.5.21-owner-approved129-debug'" dist/APK-PACKAGE.txt
          unzip -Z1 "$apk" | grep -Fqx 'assets/fonts/Lalezar-Regular.ttf'
          unzip -Z1 "$apk" | grep -Fqx 'assets/fonts/Lalezar-OFL.txt'
          unzip -Z1 "$apk" | grep -Fqx 'assets/images/photo_quotes/quote_105.jpg'
          unzip -Z1 "$apk" | grep -Fqx 'assets/pmm_unified_background_audio_v124.js'
          # Verify the built APK contains the owner's exact phone-approved HTML bytes.
          python3 - <<'PY'
          import hashlib, subprocess
          data=subprocess.check_output(['unzip','-p','app/build/outputs/apk/debug/app-debug.apk','assets/index.html'])
          blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert blob=='9c215076a6efc0a02333425bd06810ca1112b3c1',blob
          print('PASS: APK contains exact owner-approved Touch97 HTML blob',blob)
          PY
          if unzip -Z1 "$apk" | grep -Fqx 'assets/pmm_owner_wisdom_tools_v121.js'; then
            echo 'FAIL: unrequested Tafal wisdom module has returned'; exit 1
          fi
          cp "$apk" dist/PayeMenbareMola-v129-APPROVED-MAIN-DEBUG.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          # Full immutable Git source archive includes ALL app/java/assets/scripts/docs/locks,
          # never release signing keys, built APKs, Gradle outputs or external secrets.
          git archive --format=zip --output=dist/PayeMenbareMola-v129-COMPLETE-TESTED-SOURCE.zip HEAD
          unzip -tq dist/PayeMenbareMola-v129-COMPLETE-TESTED-SOURCE.zip
          unzip -Z1 dist/PayeMenbareMola-v129-COMPLETE-TESTED-SOURCE.zip | grep -Fqx "design/owner-v129-main-app-lock.json"
          unzip -Z1 dist/PayeMenbareMola-v129-COMPLETE-TESTED-SOURCE.zip | grep -Fqx "app/src/main/assets/index.html"
          unzip -Z1 dist/PayeMenbareMola-v129-COMPLETE-TESTED-SOURCE.zip | grep -Fqx "app/src/main/assets/fonts/Lalezar-Regular.ttf"
          (cd dist && sha256sum *.zip >> SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          git restore -- app/build.gradle
          python3 scripts/verify_owner_v129_main_lock.py
          git diff --exit-code -- app/
          test -z "$(git ls-files --others --exclude-standard -- app/src/)"
          git rev-parse HEAD > dist/SOURCE-COMMIT.txt
          printf 'OWNER APPROVED MAIN v129: native Recents audio stop + exact approved Touch97 controls. Independent Debug APK, NOT a market release.\n' > dist/README.txt
          cat dist/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          echo "Exact source commit $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: PayeMenbareMola-v129-APPROVED-MAIN-${{ github.run_id }}
          path: dist/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
